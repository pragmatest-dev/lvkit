name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv build

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # required for OIDC trusted publishing

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1

  deploy-render:
    # Redeploy the Cloud Run render service AFTER PyPI publish. The service
    # builds lvkit from repo SOURCE (deploy/cloudrun/Dockerfile), not the wheel,
    # so a release is only fully shipped once the tagged source is redeployed —
    # this is release step 5 (see CLAUDE.md), previously a manual gcloud run.
    # Auth is keyless via Workload Identity Federation (no stored SA key); the
    # OIDC token is accepted only from this repo (the WIF provider's
    # attribute.repository condition) and impersonates gh-release-deployer.
    name: Deploy Cloud Run render service
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # mint the OIDC token WIF exchanges for GCP creds

    steps:
      - uses: actions/checkout@v4  # build context = repo root (lvkit source)

      - uses: google-github-actions/auth@v2
        with:
          project_id: project-26d492c0-05e8-441b-bd9
          workload_identity_provider: projects/1043152135477/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: gh-release-deployer@project-26d492c0-05e8-441b-bd9.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - name: Build image + deploy to Cloud Run
        run: |
          gcloud builds submit --config deploy/cloudrun/cloudbuild.yaml \
            --substitutions=_IMAGE=gcr.io/project-26d492c0-05e8-441b-bd9/lvkit-render,_REGION=us-central1 \
            .

  refresh-pragmatest:
    # Regenerate the pragmatest.com lvkit example pages against the tagged lvkit
    # and commit them to that repo (Vercel auto-deploys the push). Inputs are
    # cloned from PUBLIC sources at build time (JKI-VI-Tester + OpenG) — no
    # corpus or fixtures committed here. Docs on pragmatest re-sync themselves at
    # Vercel build; only these STATIC render/diff example HTMLs need pushing.
    # Auth: a GitHub App (short-lived, scoped to pragmatest.com) — org policy
    # disallows deploy keys/PATs. Skips cleanly if the app secrets aren't set.
    name: Refresh pragmatest examples
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4  # lvkit source (the build script + the tool)

      - uses: astral-sh/setup-uv@v5
      - run: uv sync

      - name: Mint a scoped token for pragmatest.com
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.PRAGMATEST_APP_ID }}
          private-key: ${{ secrets.PRAGMATEST_APP_PRIVATE_KEY }}
          repositories: pragmatest.com

      - name: Check out pragmatest.com
        uses: actions/checkout@v4
        with:
          repository: pragmatest-dev/pragmatest.com
          token: ${{ steps.app-token.outputs.token }}
          path: pragmatest

      - name: Regenerate example pages
        run: bash scripts/build_example_pages.sh "$PWD/pragmatest/public/lvkit"

      - name: Commit + push if changed
        working-directory: pragmatest
        run: |
          git config user.name "lvkit-release-bot"
          git config user.email "lvkit-release-bot@users.noreply.github.com"
          git add public/lvkit
          if git diff --cached --quiet; then
            echo "no example changes — nothing to push"
          else
            git commit -m "lvkit: regenerate example pages for ${GITHUB_REF_NAME}"
            git push
          fi
