name: Publish VS Code extension

# Fires on an EXTENSION tag (ext-v*), separate from the PyPI publish (v*).
#
#   verify  ->  build (fan out: one .vsix per platform)  ->  publish (fan in)
#
# Each platform builds its binary AND packages its own .vsix, uploading the
# finished artifact. The publish job then does exactly one thing: upload the
# four .vsix files. All the work that can fail — PyInstaller, vsce's secret
# scan, manifest validation, size limits — happens in the fan-out, so
# `needs: build` is a real all-or-nothing gate: if any platform cannot be
# packaged, NOTHING is published. Earlier revisions published targets one at a
# time and repeatedly left some platforms live and others missing.
#
# Packaging natively also keeps the executable bit correct without a tar
# round-trip (upload-artifact does not preserve permissions, but a .vsix is a
# zip that carries its own modes).
on:
  push:
    tags:
      - "ext-v*"
  # Manual dry-run: builds + uploads the four .vsix artifacts WITHOUT publishing
  # (the publish job below is gated to ext-v* tag pushes). Use it to install and
  # test the exact Marketplace binary on each platform before cutting a release.
  workflow_dispatch:

jobs:
  # Cheap gate BEFORE the expensive builds: vsce takes the version from
  # package.json, NOT from the tag, so a mismatched tag would silently ship the
  # wrong version. Fail in seconds rather than after four PyInstaller runs.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify tag matches package.json version
        shell: bash
        run: |
          pkg=$(node -p "require('./editors/vscode/package.json').version")
          if [ "${{ github.event_name }}" != "push" ]; then
            echo "Dry-run (workflow_dispatch): building $pkg, will NOT publish."
            exit 0
          fi
          tag="${GITHUB_REF_NAME#ext-v}"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::Tag ext-v$tag does not match package.json version $pkg"
            exit 1
          fi
          echo "Publishing version $pkg"

  build:
    needs: verify
    # Every target builds on ONE Ubuntu runner: the extension bundles a
    # self-contained runtime (approach B) — a python-build-standalone CPython +
    # lvkit installed via `pip install --target` — and invokes it directly as
    # `<bundled-python> -m lvkit`. `pip --target` unpacks wheels WITHOUT running
    # the target interpreter, so a win32/darwin bundle builds fine on Linux;
    # vsce's --target only stamps the manifest's TargetPlatform.
    runs-on: ubuntu-latest
    strategy:
      # Report every platform's result instead of cancelling siblings on the
      # first failure — `needs: build` already blocks publishing unless all
      # four succeed, so full diagnostics cost nothing.
      fail-fast: false
      matrix:
        target: [linux-x64, win32-x64, darwin-x64, darwin-arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # CPython 3.12 provides pip (for `pip install --target`) AND a `python3.12`
      # for the hash-based .pyc precompile step (so first render is instant, not
      # a ~20s recompile). Must match the bundle's pinned CPython minor (3.12).
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Fetch this target's self-contained runtime: python-build-standalone +
      # lvkit + deps installed into bin/, with bytecode precompiled hash-based.
      - name: Fetch bundled runtime for this platform
        shell: bash
        run: bash editors/vscode/build/fetch-bundle.sh ${{ matrix.target }}

      - name: Package .vsix for this platform
        shell: bash
        working-directory: editors/vscode
        run: |
          npx --yes @vscode/vsce package --target ${{ matrix.target }} \
            --no-git-tag-version -o "lvkit-${{ matrix.target }}.vsix"
          ls -la "lvkit-${{ matrix.target }}.vsix"

      - uses: actions/upload-artifact@v4
        with:
          name: vsix-${{ matrix.target }}
          path: editors/vscode/lvkit-${{ matrix.target }}.vsix
          retention-days: 5

  publish:
    needs: build
    # ONLY on an ext-v* tag push. A manual workflow_dispatch run still reaches
    # build (the .vsix artifacts are uploaded), but this job is skipped, so
    # nothing is ever published from a dry-run.
    if: startsWith(github.ref, 'refs/tags/ext-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/download-artifact@v4
        with:
          path: vsix
          merge-multiple: true

      - name: Publish all platform packages
        shell: bash
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          set -euo pipefail
          ls -la vsix
          # Every target must be present before anything is uploaded.
          for target in linux-x64 win32-x64 darwin-x64 darwin-arm64; do
            test -f "vsix/lvkit-$target.vsix" || {
              echo "::error::missing vsix/lvkit-$target.vsix"; exit 1; }
          done
          for target in linux-x64 win32-x64 darwin-x64 darwin-arm64; do
            echo "::group::publish $target"
            npx --yes @vscode/vsce publish \
              --packagePath "vsix/lvkit-$target.vsix" --pat "$VSCE_PAT"
            echo "::endgroup::"
          done
