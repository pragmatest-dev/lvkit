name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --all-extras --dev
      - name: Ruff
        run: uv run ruff check .
      # The web extension installs `lvkit==<LVKIT_WHEEL>` from PyPI at runtime,
      # pinned to the lvkit CORE version and DECOUPLED from the extension's own
      # version (an extension-only fix ships without a PyPI republish). But the
      # pin must track the published core: it has to equal pyproject's version,
      # or the web target would install a stale/absent wheel. Fails if a core
      # (src/lvkit) version bump forgot to update the pin, or vice-versa.
      - name: Web lvkit wheel pin matches core version
        run: |
          pin=$(grep -oE 'LVKIT_WHEEL = "lvkit==[0-9]+\.[0-9]+\.[0-9]+"' editors/vscode/web/extension.js | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          proj=$(grep -oE '^version = "[0-9]+\.[0-9]+\.[0-9]+"' pyproject.toml | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          echo "web LVKIT_WHEEL pin=$pin  pyproject=$proj"
          if [ "$pin" != "$proj" ]; then
            echo "::error::LVKIT_WHEEL pin ($pin) != pyproject version ($proj). The web target installs lvkit==<pin> from PyPI, so a core release must bump BOTH — update LVKIT_WHEEL in editors/vscode/web/extension.js (and publish lvkit==$proj to PyPI)."
            exit 1
          fi

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --all-extras --dev
      # lvkit type-checks its shipped package; scripts/ and branding/ are
      # auxiliary and intentionally out of scope.
      - name: Pyright
        run: uv run pyright src/

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # pyproject declares requires-python >=3.10, but only 3.12+ is green:
        # array-ops codegen emits Python that relies on comprehension variables
        # leaking into the enclosing scope, which works only from 3.12 (PEP 709
        # inlined comprehensions) — on 3.10/3.11 the generated code NameErrors.
        # That is a real codegen bug (generated output should run on the declared
        # floor); tracked separately. Test the versions that actually pass until
        # it's fixed.
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv sync --all-extras --dev

      # Skip tests that need the local-only sample corpus (~54 parser/diff/render
      # tests). Pulling it means 8 git clones + extraction (~2 min) and an
      # upstream-flake dependency; those tests run in local pre-commit, where the
      # corpus is present. See the `needs_samples` marker / tests/conftest.py.
      - name: Pytest
        run: uv run pytest -q -m "not needs_samples"

  # The web (browser / Pyodide) extension renders VIs in WebAssembly instead of a
  # native binary. That is only safe if the wasm render is byte-identical to the
  # native one — this guard renders a feature-diverse set of fixtures both ways
  # and fails on any divergence, so renderer changes can never silently break the
  # web target. Builds the same self-hosted Pyodide + wheels the VSIX ships.
  web-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build self-hosted web assets (Pyodide + wheels) for the parity render
        working-directory: editors/vscode
        # The shipped web VSIX is CDN-only (no media/), but the parity check needs a
        # self-hosted Pyodide to run the wasm render — so build it directly here,
        # independent of `build:web` (which no longer produces media/).
        run: |
          npm ci
          bash build/build-web-assets.sh
      - name: Web (wasm) render == native render, byte-for-byte
        run: bash editors/vscode/build/check-web-parity.sh

  build:
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv build
      # Install the built wheel into a CLEAN venv (deps resolved fresh from
      # PyPI, not the lockfile, so `mcp` floats to the newest allowed — 2.x)
      # and start the MCP server. A silent MCP API break (an import moving, as
      # FastMCP -> MCPServer did in mcp 2.0) registers zero tools and fails
      # SILENTLY at runtime; --selftest turns that into a non-zero exit here so
      # it can never reach a release again — on whichever `mcp` major resolves.
      - name: MCP server starts on a fresh install
        run: |
          uv venv /tmp/mcp-check
          uv pip install --python /tmp/mcp-check/bin/python dist/*.whl
          /tmp/mcp-check/bin/lvkit mcp --selftest
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
