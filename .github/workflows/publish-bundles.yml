name: Publish lvkit bundles

# ONE build per platform, published as MANY forms. Fires on an EXTENSION tag
# (ext-v*), separate from the PyPI publish (v*).
#
#   verify -> build (fan out: native runner per OS) -> publish (VSIX) + release-bundles
#
# Each platform builds ITS OWN `lvkit` standalone binary once (PyInstaller, via
# build-binary.sh) on that platform's NATIVE runner, then packages EVERY
# distribution form from that single build: the VS Code .vsix, the standalone
# binary zip, the Claude Code plugin archive, and (macOS+Windows) the Claude
# Desktop .mcpb (see assemble_bundles.sh/.ps1). win32-x64 additionally code-signs
# every PE in the bundle (Azure Artifact Signing) before packaging — Windows
# Authenticode/signtool signing can ONLY run on a Windows runner, which is why
# this job matrix uses a real per-OS `os` field instead of building everything
# on one Linux runner. All the work that can fail — PyInstaller, signing, vsce's
# secret scan, manifest validation, size limits — happens in the fan-out, so
# `needs: build` is a real all-or-nothing gate: if any platform cannot be
# packaged, NOTHING is published.
#
# Packaging natively also keeps the executable bit correct without a tar
# round-trip (upload-artifact does not preserve permissions, but a .vsix is a
# zip that carries its own modes).
on:
  push:
    tags:
      - "ext-v*"
  # Manual dry-run: builds + uploads the four .vsix artifacts WITHOUT publishing
  # (the publish job below is gated to ext-v* tag pushes). Use it to install and
  # test the exact Marketplace binary on each platform before cutting a release.
  workflow_dispatch:

jobs:
  # Cheap gate BEFORE the expensive builds: vsce takes the version from
  # package.json, NOT from the tag, so a mismatched tag would silently ship the
  # wrong version. Fail in seconds rather than after four PyInstaller runs.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify tag matches package.json version
        shell: bash
        run: |
          pkg=$(node -p "require('./editors/vscode/package.json').version")
          if [ "${{ github.event_name }}" != "push" ]; then
            echo "Dry-run (workflow_dispatch): building $pkg, will NOT publish."
            exit 0
          fi
          tag="${GITHUB_REF_NAME#ext-v}"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::Tag ext-v$tag does not match package.json version $pkg"
            exit 1
          fi
          echo "Publishing version $pkg"

  build:
    needs: verify
    strategy:
      # Report every platform's result instead of cancelling siblings on the
      # first failure — `needs: build` already blocks publishing unless all
      # four succeed, so full diagnostics cost nothing.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
          - os: windows-latest
            target: win32-x64
          # macos-13 was RETIRED 2025-12-04 (jobs queue forever and never
          # start); macos-14 is deprecated (unsupported after 2026-11-02).
          # macos-15 is the current arm64 image, macos-15-intel replaces the
          # x86_64 label. Apple has discontinued x86_64 and GitHub drops macOS
          # Intel when macOS 15 retires (Fall 2027) — darwin-x64 is sunsetting.
          - os: macos-15-intel
            target: darwin-x64
          - os: macos-15
            target: darwin-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # PyInstaller builds a onedir bundle FROM THE REPO'S OWN lvkit (uv pip
      # install -e .), so it always picks up whatever version is pinned in
      # pyproject.toml at the tagged commit — nothing to bump here separately.
      - name: Build bundled lvkit binary
        shell: bash
        run: |
          uv venv
          uv pip install -e . pyinstaller
          uv run bash editors/vscode/build/build-binary.sh

      # Windows only: sign every PE in the bundle so Smart App Control (which
      # blocks unsigned native code on enforce-mode Win11) allows the bundled
      # lvkit binary. SAC evaluates each on-disk file by its own hash, so every
      # .exe/.dll/.pyd under bin/lvkit/ must be signed, not just the .vsix.
      # This MUST run on a Windows runner: Authenticode/signtool signing has no
      # Linux equivalent (`dotnet sign` throws System.DllNotFoundException:
      # kernel32.dll off Windows) — hence this job's per-OS matrix instead of
      # building every target on one Ubuntu runner.
      - name: Code-sign the bundled binary (Artifact Signing)
        if: matrix.target == 'win32-x64'
        uses: azure/artifact-signing-action@v2
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          # Force DefaultAzureCredential down the plain client-secret path (the
          # documented approach for service-principal auth, no OIDC/id-token
          # permission needed).
          exclude-environment-credential: false
          exclude-workload-identity-credential: true
          exclude-managed-identity-credential: true
          exclude-shared-token-cache-credential: true
          exclude-visual-studio-credential: true
          exclude-visual-studio-code-credential: true
          endpoint: https://wus2.codesigning.azure.net/
          signing-account-name: pragmatest
          certificate-profile-name: pragmatest-public-trust
          files-folder: ${{ github.workspace }}\editors\vscode\bin\lvkit
          files-folder-filter: exe,dll,pyd
          files-folder-recurse: true

      # Ship the SAME bundle (signed on win32) as a downloadable release asset,
      # so lvkit works as a zero-setup MCP server / CLI with no Python/uv/pip.
      # The onedir bundle is relocatable — verified `lvkit mcp` lists all 16
      # tools from a fresh unzip. Asset is versioned by the BUNDLED lvkit
      # (e.g. lvkit-mcp-0.5.8-win32-x64.zip), not the extension tag. `zip -y`
      # keeps the exec bit + any framework symlinks; ubuntu/macos runners have
      # `zip`, Windows uses Compress-Archive.
      - name: Package standalone binary (unix)
        if: matrix.target != 'win32-x64'
        shell: bash
        run: |
          ver=$(editors/vscode/bin/lvkit/lvkit --version | awk '{print $2}')
          ( cd editors/vscode/bin && zip -q -r -y \
              "$GITHUB_WORKSPACE/lvkit-mcp-$ver-${{ matrix.target }}.zip" lvkit )
          ls -la "lvkit-mcp-$ver-${{ matrix.target }}.zip"
      - name: Package standalone binary (windows)
        if: matrix.target == 'win32-x64'
        shell: pwsh
        run: |
          $ver = (& "$env:GITHUB_WORKSPACE\editors\vscode\bin\lvkit\lvkit.exe" --version).Split(' ')[1]
          Compress-Archive -Path "$env:GITHUB_WORKSPACE\editors\vscode\bin\lvkit" `
            -DestinationPath "$env:GITHUB_WORKSPACE\lvkit-mcp-$ver-win32-x64.zip"
          Get-ChildItem "$env:GITHUB_WORKSPACE\lvkit-mcp-$ver-win32-x64.zip"

      # Resolve the BUNDLED lvkit version once (the plugin manifest + .mcpb are
      # versioned by it, not by the extension tag).
      - name: Resolve bundled lvkit version (unix)
        if: matrix.target != 'win32-x64'
        shell: bash
        run: echo "LVKIT_VER=$(editors/vscode/bin/lvkit/lvkit --version | awk '{print $2}')" >> "$GITHUB_ENV"
      - name: Resolve bundled lvkit version (windows)
        if: matrix.target == 'win32-x64'
        shell: pwsh
        run: |
          $v = (& "$env:GITHUB_WORKSPACE\editors\vscode\bin\lvkit\lvkit.exe" --version).Split(' ')[1]
          "LVKIT_VER=$v" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # Assemble the OTHER distribution forms from the SAME built (signed) binary:
      # the Claude Code plugin archive (all targets) and the Claude Desktop .mcpb
      # (macOS + Windows only — Desktop has no Linux). One build, many bundles.
      - name: Assemble plugin + .mcpb bundles (unix)
        if: matrix.target != 'win32-x64'
        shell: bash
        run: bash editors/vscode/build/assemble_bundles.sh "${{ matrix.target }}" "$LVKIT_VER"
      - name: Assemble plugin + .mcpb bundles (windows)
        if: matrix.target == 'win32-x64'
        shell: pwsh
        run: pwsh editors/vscode/build/assemble_bundles.ps1 -Target win32-x64 -Ver $env:LVKIT_VER

      # SHA-256 sidecars for every release asset (integrity for the manual test
      # plan and a future pinned marketplace.json).
      - name: Checksums (unix)
        if: matrix.target != 'win32-x64'
        shell: bash
        run: |
          for f in lvkit-mcp-*.zip lvkit-plugin-*.zip lvkit-*.mcpb; do
            [ -e "$f" ] || continue
            shasum -a 256 "$f" > "$f.sha256"
          done
          ls -la lvkit-*.sha256
      - name: Checksums (windows)
        if: matrix.target == 'win32-x64'
        shell: pwsh
        run: |
          Get-ChildItem -Path 'lvkit-mcp-*.zip','lvkit-plugin-*.zip','lvkit-*.mcpb' -ErrorAction SilentlyContinue | ForEach-Object {
            $h = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$h  $($_.Name)" | Out-File -FilePath "$($_.FullName).sha256" -Encoding ascii
          }

      - name: Package .vsix for this platform
        shell: bash
        working-directory: editors/vscode
        run: |
          npx --yes @vscode/vsce package --target ${{ matrix.target }} \
            --no-git-tag-version -o "lvkit-${{ matrix.target }}.vsix"
          ls -la "lvkit-${{ matrix.target }}.vsix"

      - uses: actions/upload-artifact@v4
        with:
          name: vsix-${{ matrix.target }}
          path: editors/vscode/lvkit-${{ matrix.target }}.vsix
          retention-days: 5

      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.target }}
          path: |
            lvkit-mcp-*.zip
            lvkit-plugin-*.zip
            lvkit-*.mcpb
            lvkit-*.sha256
          retention-days: 5

  publish:
    needs: build
    # ONLY on an ext-v* tag push. A manual workflow_dispatch run still reaches
    # build (the .vsix artifacts are uploaded), but this job is skipped, so
    # nothing is ever published from a dry-run.
    if: startsWith(github.ref, 'refs/tags/ext-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/download-artifact@v4
        with:
          path: vsix
          merge-multiple: true

      - name: Publish all platform packages
        shell: bash
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          set -euo pipefail
          ls -la vsix
          # Every target must be present before anything is uploaded.
          for target in linux-x64 win32-x64 darwin-x64 darwin-arm64; do
            test -f "vsix/lvkit-$target.vsix" || {
              echo "::error::missing vsix/lvkit-$target.vsix"; exit 1; }
          done
          for target in linux-x64 win32-x64 darwin-x64 darwin-arm64; do
            echo "::group::publish $target"
            npx --yes @vscode/vsce publish \
              --packagePath "vsix/lvkit-$target.vsix" --pat "$VSCE_PAT"
            echo "::endgroup::"
          done

  # Attach ALL distribution forms to a GitHub Release for the tag — permanently
  # downloadable (Actions artifacts expire): the standalone binary zips, the
  # Claude Code plugin archives, and the Claude Desktop .mcpb bundles, each with a
  # .sha256 sidecar. Independent of the Marketplace publish above; skipped on a
  # dry-run (workflow_dispatch) because it is gated on the ext-v* tag ref.
  release-bundles:
    needs: build
    if: startsWith(github.ref, 'refs/tags/ext-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          path: bins
          merge-multiple: true
      - name: List assets
        shell: bash
        run: ls -la bins
      - name: Attach all bundles to the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            bins/lvkit-mcp-*.zip
            bins/lvkit-plugin-*.zip
            bins/lvkit-*.mcpb
            bins/*.sha256
          fail_on_unmatched_files: true
          body: |
            lvkit ${{ github.ref_name }} — install for your app, no Python/uv/pip.

            **One-click (recommended)**
            - **Claude Desktop** — download `lvkit-<target>.mcpb`, double-click, pick your VI folder.
            - **Claude Code** — `claude plugin marketplace add pragmatest-dev/lvkit` then
              `claude plugin install lvkit-<target>@pragmatest-lvkit`.
            - **VS Code** — install the LVKit extension from the Marketplace.

            **Manual (any MCP client)** — download `lvkit-mcp-<version>-<target>.zip`, unzip, and
            point your client at the binary:

            ```json
            { "mcpServers": { "lvkit": { "command": "/abs/path/to/lvkit/lvkit", "args": ["mcp"] } } }
            ```
            (`lvkit\lvkit.exe` on Windows.)

            Each asset has a `.sha256` sidecar.

            - **win32-x64** — Authenticode-signed (Azure Public Trust); runs under Smart App Control.
            - **linux-x64** — unsigned ELF.
            - **darwin-x64 / darwin-arm64** — unsigned; Gatekeeper quarantines
              downloads — clear with `xattr -dr com.apple.quarantine lvkit/`.
