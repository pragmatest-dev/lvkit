[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lvkit"
version = "0.8.1"
description = "Understand and convert LabVIEW VIs to Python without a LabVIEW license"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [
    { name = "Pragmatest" }
]
keywords = [
    "labview",
    "vi",
    "code-generation",
    "static-analysis",
    "ast",
    "mcp",
    "ni",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Software Development :: Compilers",
    "Topic :: Software Development :: Disassemblers",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "pylabview",
    "networkx",
    "mcp>=1.2",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
visualize = ["pyvis"]

[project.urls]
Repository = "https://github.com/pragmatest-dev/lvkit"
Issues = "https://github.com/pragmatest-dev/lvkit/issues"

[project.scripts]
lvkit = "lvkit.cli:main"
lvkit-mcp = "lvkit.mcp.server:main"

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "pyright",
    "pre-commit",
    "cairosvg>=2.9.0",
    "pytest-xdist>=3.8.0",
]

[tool.hatch.build.targets.wheel]
# Bundled JSON data and skill templates live INSIDE the package at
# src/lvkit/data/ and src/lvkit/skill_templates/ so they ride along with
# the wheel automatically. The resolvers and `lvkit setup` load
# them via paths relative to the package or via importlib.resources.
packages = ["src/lvkit"]
# lvkit is cleanroom: it ships NO NI-derived primitive artwork. Primitive
# glyphs are drawn procedurally by the render layer (OriginalGlyphResolver /
# GeneratedGlyphResolver); un-migrated primitives render as a labeled box. The
# NI-icon extraction path (a data/glyphs/ asset dir + PdfIconResolver) was
# removed for licensing. These exclude globs remain as a guard so no such
# asset can ever be packaged if the directory is reintroduced.
exclude = ["src/lvkit/data/glyphs/*.png", "src/lvkit/data/glyphs/*.svg"]

[tool.hatch.build.targets.sdist]
include = [
    "src/lvkit",
    "tests",
    "scripts",
    "README.md",
    "LICENSE",
    "pyproject.toml",
    ".pre-commit-config.yaml",
]
exclude = [
    "samples",
    "outputs",
    "docs/labview_ref_manual.txt",
    "docs/*.pdf",
    "src/lvkit/data/glyphs/*.png",
    "src/lvkit/data/glyphs/*.svg",
    ".lvkit",
    ".tmp",
]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
# Auxiliary generators/utilities (not shipped in the package) whose long lines
# are inherent literal content — SVG path/format strings.
"branding/*.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Parallel by default (pytest-xdist across all cores) and skip the slow
# full-corpus acceptance tests — run those explicitly with `-m slow`, and
# override parallelism with `-p no:xdist` / `-n0` when you need serial output.
addopts = "-n auto -m 'not slow'"
markers = [
    "needs_samples: test reads the local-only sample VI corpus (.lvkit/cache/samples). Auto-skipped when the corpus is absent; pull it with scripts/pull_samples.sh.",
    "slow: full-corpus acceptance/integration test (e.g. indexing the whole sample set); excluded from the default run, opt in with `-m slow`.",
]
