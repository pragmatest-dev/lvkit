<title>__TITLE__</title>
<style>
  /* Chrome is DEFAULT LIGHT (GitHub-light-ish) with a
     @media (prefers-color-scheme: dark) override — same token approach as
     diff_viewer.html — so the standalone page is light in a light viewer and
     dark in a dark one. The embedded diagram SVG is themed SEPARATELY (rendered
     --theme auto): the toolbar theme button flips document.documentElement's
     data-theme, which re-themes the inline SVG live (see theme_control.py). */
  :root{
    --hl-r:6px;   /* ONE source of truth for the highlight corner radius, same
                     token the diff viewer defines. Here the shared properties
                     panel CSS (.prop-row) rounds from it. Change it once. */
    --bg:#ffffff;--panel:#f6f8fa;--fg:#1f2328;--line:#d0d7de;
    --canvas:#ffffff;--btn:#eaeef2;--btn-hover:#dfe4ea;--fg-muted:#57606a;
    --accent:#0969da;--accent-fg:#ffffff;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0d1117;--panel:#161b22;--fg:#e6edf3;--line:#30363d;
      --btn:#21262d;--btn-hover:#2a3038;--fg-muted:#aeb6c2;
      --accent:#1f6feb;--accent-fg:#e6edf3;
    }
  }
  /* DIAGRAM theme only. The ◐/☀/☾ toggle sets data-theme on <html> to re-theme
     the embedded diagram SVG (its own CSS listens to it). The ONLY chrome
     property allowed to follow the toggle is --canvas — the diagram backdrop,
     visually part of the diagram. ALL other chrome above follows the
     system/editor theme (plain @media) and must NEVER react to data-theme. */
  @media (prefers-color-scheme: dark){ :root:not([data-theme]){--canvas:#1b1c1e} }
  :root[data-theme="dark"]{--canvas:#1b1c1e}
  :root[data-theme="light"]{--canvas:#ffffff}
  /* Diagram-SURFACE panel tokens: like --canvas, they follow the DIAGRAM theme
     (the ◐/☀/☾ data-theme toggle), so an in-view panel drawn over the diagram
     (the properties popover) matches the diagram's palette, not the window
     chrome. Separate from the --panel/--line/--fg chrome tokens above, which
     stay system-themed. */
  /* Values are the DIAGRAM theme's own roles (style.py DEFAULT_THEME / theme_web
     DARK_PALETTE): --dpanel = canvas, --dline = struct_border, --dfg = text,
     --dfg-muted = pane_type_text — so an in-view panel is the SAME material as
     the drawn-in-SVG VI dialogs (tooltip / connector-pane help). */
  :root{--dpanel:#fbfbf5;--dline:#1e1e1e;--dfg:#1a1a1a;--dfg-muted:#777777}
  @media (prefers-color-scheme: dark){ :root:not([data-theme]){
    --dpanel:#1b1c1e;--dline:#cdcdcd;--dfg:#e8e8e0;--dfg-muted:#9a9a9a} }
  :root[data-theme="dark"]{--dpanel:#1b1c1e;--dline:#cdcdcd;--dfg:#e8e8e0;
    --dfg-muted:#9a9a9a}
  :root[data-theme="light"]{--dpanel:#fbfbf5;--dline:#1e1e1e;--dfg:#1a1a1a;
    --dfg-muted:#777777}
  *{box-sizing:border-box}
  body{margin:0;font:14px/1.4 system-ui,sans-serif;background:var(--bg);color:var(--fg);
       display:grid;grid-template-rows:auto 1fr;height:100vh}
  header{padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line);
         display:flex;gap:14px;align-items:center;flex-wrap:wrap}
  /* The title row is its own full-width flex line (flex:1 1 100% forces the
     wrap below onto its own row) — the title grows/truncates, pushing the
     properties button to the row's right edge, right where a reader's eye
     already lands after the VI name. */
  .titlerow{display:flex;align-items:center;gap:10px;flex:1 1 100%;min-width:0}
  .titlebtns{display:inline-flex;gap:6px;align-items:center}
  header b{font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
    flex:1 1 auto;min-width:0}
  .controls{display:flex;gap:6px;align-items:center;flex-wrap:nowrap;margin-left:auto}
  button{background:var(--btn);color:var(--fg);border:1px solid var(--line);border-radius:6px;
         padding:5px 10px;cursor:pointer;font:inherit}
  button:hover{background:var(--btn-hover)}
  .zoomgrp{display:inline-flex;gap:2px;align-items:center}
  .zoomgrp button{padding:5px 9px;min-width:30px;font-weight:600}
  /* Icon buttons (the diagram-theme toggle) match the zoom buttons' footprint. */
  .lvkit-theme-btn{min-width:30px;padding:5px 9px}
  /* stage-wrap is the grid 1fr child; the stage fills it absolutely so the
     minimap can pin over the stage corner without scrolling with it. */
  .stage-wrap{position:relative;overflow:hidden;min-height:0}
  /* ONE scrollable pane holding the inline diagram SVG. grab cursor invites the
     drag-to-pan; the pan handler flips it to grabbing while a drag is active. */
  .stage{position:absolute;inset:0;padding:16px;overflow:auto;cursor:grab;
         -webkit-user-select:none;user-select:none}
  svg{max-width:none;height:auto;background:var(--canvas);border-radius:6px}
  /* Minimap / navigation overlay (RTS-style), pinned over the stage corner.
     Plain tokens only — chrome follows the viewer/system theme, never data-theme. */
  .minimap{position:absolute;right:10px;bottom:10px;width:180px;max-width:45%;
    background:var(--panel);border:1px solid var(--line);border-radius:6px;
    box-shadow:0 2px 12px rgba(0,0,0,.28);overflow:hidden;z-index:5;cursor:pointer}
  .minimap[hidden]{display:none}
  /* The thumbnail is a LIVE inline clone of the diagram SVG (not a rasterised
     data-URI) so it inherits the page CSS + the diagram's data-theme palette and
     stays true to what's on screen. width:100% + the svg's own viewBox scales it
     down; height:auto keeps the aspect ratio. */
  .mm-mirror{display:block;pointer-events:none;opacity:.92;font-size:0}
  .mm-mirror svg{display:block;width:100%;height:auto;max-width:100%;background:none;border-radius:0}
  .mm-view{position:absolute;border:2px solid var(--accent);border-radius:2px;
    background:var(--accent);opacity:.22;pointer-events:none}
  /* VI connector-pane aside overlay (the ▦ toggle) -- SHARED with the diff viewer
     (CONNECTOR_PANE_CSS in connector_pane_panel.py); pinned + clamped to this
     .stage-wrap content area so it never scales with zoom or exceeds the view. */
  __CONNECTOR_PANE_CSS__
</style>

__THEME_SCRIPT__

<script>
// ── Single-pane zoom/pan ─────────────────────────────────────────────────────
// A small, self-contained controller (NOT the diff viewer's two-pane machinery).
// The embedded render SVG carries its OWN frame-toggle/hover JS + root id, so we
// never touch its internals — we only rescale it (width) and pan its scroll
// container. zoom=1 == fit-to-width; zoom grows the svg's css width past the
// stage so the stage scrolls.
const stage=document.getElementById('stage');
const svg=stage.querySelector('svg');
const minimap=document.getElementById('minimap');
const mmView=document.getElementById('mmView');
const PAD=16;
let zoom=1;
function fitScale(){                    // css px per user px at zoom=1
  if(!svg)return 1;
  const w=svg.viewBox.baseVal.width||1;
  return (stage.clientWidth-2*PAD)/w;
}
// The zoom (relative to width-fit=1) at which the WHOLE diagram — width AND
// height — fits the stage with no scrollbars. Clamped to 1 so a wide-short VI
// stays at the readable width-fit; only a TALL VI drives Fit below 1.
function fitBothZoom(){
  if(!svg)return 1;
  const h=svg.viewBox.baseVal.height||1;
  const heightCssPerUser=(stage.clientHeight-2*PAD)/h;
  return Math.max(0.02, Math.min(1, heightCssPerUser/fitScale()));
}
function applyZoom(){
  if(!svg)return;
  svg.style.width=(svg.viewBox.baseVal.width*fitScale()*zoom)+'px';
  updateMinimap();
}
// Keep the viewport point (ax,ay) fixed while zooming (native pinch feel). zoom
// floors at fitBothZoom() (the whole diagram in view) so it never shrinks past
// "everything visible" — width-fit for a wide VI, height-fit for a tall one.
function setZoom(z, ax, ay){
  z=Math.max(fitBothZoom(), Math.min(z, 8));
  if(ax===undefined){ax=stage.clientWidth/2; ay=stage.clientHeight/2;}
  const ratio=z/zoom, cx=stage.scrollLeft+ax, cy=stage.scrollTop+ay;
  zoom=z; applyZoom();
  stage.scrollLeft=cx*ratio-ax; stage.scrollTop=cy*ratio-ay;
}
function fit(){ setZoom(1); stage.scrollLeft=0; stage.scrollTop=0; }  // Fit = width-fit; zoom-out floor (setZoom) still reaches fit-both
document.getElementById('zoomIn').onclick=()=>setZoom(zoom*1.3);
document.getElementById('zoomOut').onclick=()=>setZoom(zoom/1.3);
document.getElementById('zoomFit').onclick=fit;
addEventListener('keydown',e=>{
  if(e.target&&/^(INPUT|TEXTAREA)$/.test(e.target.tagName))return;
  if(e.key==='+'||e.key==='=')setZoom(zoom*1.3);
  else if(e.key==='-')setZoom(zoom/1.3);
  else if(e.key==='f'||e.key==='0')fit();
});
// Ctrl/⌘ + wheel zooms about the cursor (plain wheel = normal scroll).
stage.addEventListener('wheel',e=>{
  if(!(e.ctrlKey||e.metaKey))return; e.preventDefault();
  const r=stage.getBoundingClientRect();
  setZoom(zoom*(e.deltaY<0?1.15:1/1.15), e.clientX-r.left, e.clientY-r.top);
},{passive:false});
// Drag-to-pan: primary-button drag adjusts scrollLeft/scrollTop. No pointer
// capture (would swallow the embedded selector clicks) and no preventDefault, so
// a plain click still reaches the diagram's own frame-toggle/hover handlers — a
// pan only happens once the pointer actually MOVES with the button down.
let panning=false, lx=0, ly=0;
stage.addEventListener('pointerdown',e=>{
  if(e.button!==0)return; panning=true; lx=e.clientX; ly=e.clientY;
});
addEventListener('pointermove',e=>{
  if(!panning)return;
  stage.scrollLeft-=(e.clientX-lx); stage.scrollTop-=(e.clientY-ly);
  lx=e.clientX; ly=e.clientY; stage.style.cursor='grabbing';
});
function endPan(){ if(!panning)return; panning=false; stage.style.cursor='grab'; }
addEventListener('pointerup',endPan);
addEventListener('pointercancel',endPan);

// ── Minimap / navigation (RTS-style) ─────────────────────────────────────────
// Additive + best-effort: any failure here must never break zoom/pan. The
// thumbnail is a LIVE inline CLONE of the diagram SVG — NOT a rasterised <img>
// data-URI. An inline clone stays in THIS document, so it inherits the page CSS
// (incl. --canvas/palette vars) and re-themes automatically with <html>'s
// data-theme; its own viewBox scales it down to the minimap width. We strip the
// clone's ids (no duplicate-id collisions), its hover-help groups, and any
// embedded <script> (cloned scripts don't run, but drop them anyway) so it is a
// pure static picture. Rebuilt on demand (frame toggles) via buildMinimap().
const mmMirror=document.getElementById('mmMirror');
function buildMinimap(){
  if(!svg||!minimap||!mmMirror)return;
  const clone=svg.cloneNode(true);
  clone.removeAttribute('id');
  clone.querySelectorAll('[id]').forEach(n=>n.removeAttribute('id'));
  clone.querySelectorAll('.lv-help,script').forEach(n=>n.remove());
  clone.removeAttribute('width'); clone.removeAttribute('height');
  mmMirror.replaceChildren(clone);
}
function updateMinimap(){
  if(!svg||!minimap)return;
  // SVG elements have no offsetWidth/Height in Chrome; use the rendered box.
  const rc=svg.getBoundingClientRect();
  const contentW=rc.width, contentH=rc.height;  // current px size
  if(!contentW||!contentH){ minimap.hidden=true; return; }
  const fx=Math.min(1, stage.clientWidth/contentW);
  const fy=Math.min(1, stage.clientHeight/contentH);
  if(fx>=0.999&&fy>=0.999){ minimap.hidden=true; return; }    // whole thing visible
  minimap.hidden=false;
  const mmW=minimap.clientWidth, mmH=minimap.clientHeight;
  mmView.style.left  =(stage.scrollLeft/contentW)*mmW+'px';
  mmView.style.top   =(stage.scrollTop /contentH)*mmH+'px';
  mmView.style.width =fx*mmW+'px';
  mmView.style.height=fy*mmH+'px';
}
// Click/drag anywhere on the minimap centres the main view there.
function mmJump(e){
  if(!svg)return;
  const r=minimap.getBoundingClientRect();
  const rc=svg.getBoundingClientRect(), contentW=rc.width, contentH=rc.height;
  stage.scrollLeft=((e.clientX-r.left)/r.width )*contentW-stage.clientWidth /2;
  stage.scrollTop =((e.clientY-r.top )/r.height)*contentH-stage.clientHeight/2;
}
if(minimap){
  let mmDrag=false;
  minimap.addEventListener('pointerdown',e=>{ mmDrag=true; mmJump(e); e.preventDefault(); });
  minimap.addEventListener('pointermove',e=>{ if(mmDrag) mmJump(e); });
  addEventListener('pointerup',()=>{ mmDrag=false; });
}
stage.addEventListener('scroll',updateMinimap);

addEventListener('resize',()=>{applyZoom();updateMinimap();});
applyZoom();
try{ buildMinimap(); updateMinimap(); }catch(_){ /* minimap optional */ }
// The inline clone re-themes on its own (it inherits <html>'s data-theme), so no
// theme swap is needed. It IS a snapshot of the frame-visibility state, though —
// re-clone (debounced) whenever the live diagram's structure/classes change
// (a case-frame toggle flips lv-frame-hidden classes inside the svg).
try{
  let rb=null;
  const reclone=recs=>{
    // Ignore hover-help class flips (they don't affect the minimap picture — the
    // clone strips .lv-help) so a mere hover never triggers a full re-clone.
    if(recs&&recs.every(r=>{const t=r.target;
      return t&&t.classList&&(t.classList.contains('lv-help')||t.classList.contains('lv-help-shown'));}))return;
    clearTimeout(rb); rb=setTimeout(()=>{
      try{ buildMinimap(); updateMinimap(); }catch(_){}
    },80);
  };
  new MutationObserver(reclone).observe(svg,
    {subtree:true,attributes:true,attributeFilter:['class'],childList:true});
}catch(_){ /* minimap optional */ }
</script>
