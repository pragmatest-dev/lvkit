  // The OTHER pane's ancestor frame VALUES normally equal this pane's -- but when
  // a selector value itself changed (a "1"->"0" case rename) the before pane
  // addresses the SAME frame under the OLD value, carried in frame_path_before.
  // Drive the other pane from that when present so BOTH panes land on the renamed
  // frame; fall back to this pane's path for every other kind (same value both).
  const osegs=(c.frame_path_before||c.frame_path||'').split(';').filter(Boolean);
  let deepest=null;
  segs.forEach(seg=>{const i=seg.indexOf('='), u=seg.slice(0,i), v=seg.slice(i+1);
    if(u && st.toggleable.has(u)) st.sel[u]=v;});                 // this pane -> own path

    if(u && ost.toggleable.has(u)){ ost.sel[u]=v; deepest=u; }}); // other pane -> its own path
  if(deepest){ const oel=other.querySelector('[data-lv-struct="'+deepest+'"]');
    if(oel) revealPath(other, oel); }                    // reach the deepest match in other pane
  // A wire change carries no shared-frame-structure UID of its own to
  // correlate above (removed/added/modified wiring, not a node) -- so
  // "where the wire was connected" in the OTHER pane stays hidden unless we
  // reach for it directly. diff.py's _wire_changes now stamps `endpoints`:
  // this wire's surviving endpoint node uid(s), ALREADY translated to the
  // other pane's identity. `data-node` carries the FULL op id (e.g.
  // "MyClass.lvclass:run.vi::1781"), not the bare trailing uid ElementChange
  // uses everywhere else, so match on the "::UID" suffix -- the delimiter
  // makes this exact (a shorter uid can never falsely suffix-match a longer
  // one, since the digits right before a real match are always "::").
  if(c.kind==='wire' && Array.isArray(c.endpoints)){
    c.endpoints.forEach(uid=>{

// Interception-proof click: the renderer paints frame-content rects over the
// selector chrome, so e.target is often an unrelated rect. Scan the full stack
// under the cursor (elementsFromPoint skips the pointer-events:none help layer).
[beforePane,afterPane].forEach(p=>p.addEventListener('click',e=>{
  let s=null;
  for(const el of document.elementsFromPoint(e.clientX,e.clientY)){
    s=el.closest&&el.closest('.lv-selector,.lv-option'); if(s)break;}
  if(!s)return;
  const u=s.dataset.lvStruct; if(!u)return;
  if(s.classList.contains('lv-option')){
    setFrame(u, s.dataset.lvValue);
    // Picking a value CLOSES the dropdown — a menu left floating over the
    // freshly switched frame hides the very content the user asked to see.
    const m=p.querySelector('.lv-menu[data-lv-struct="'+u+'"]');
    if(m) m.classList.remove('lv-selector-open');

    // The renderer bakes a REAL per-value dropdown for case structures (see
    // draw.py's _draw_frame_menu: one <g class="lv-menu"><g class="lv-option"
    // data-lv-value=...> row per frame value), baked start-hidden by the
    // .lv-menu CSS rule (display:none) and opened via the .lv-selector-open class — the
    // same mechanism the renderer's OWN inline controller uses (which this
    // script-less interactive=False diff SVG never gets). Wire the same toggle
    // here so decorateMenus()'s per-value change markers (req #4) are reachable.
    const m=p.querySelector('.lv-menu[data-lv-struct="'+u+'"]');
    if(m) m.classList.toggle('lv-selector-open');

applyFrames();

// ── Structure-level frame-change decoration ─────────────────────────────────
// Investigation: the renderer DOES bake a full per-value list for CASE
// structures — draw.py's _draw_frame_menu emits one <g class="lv-menu"><g
// class="lv-option" data-lv-struct data-lv-value> row per case value (start
// hidden, opened above). Stacked sequences get no such menu (draw.py: "Only
// cases get a menu") — only the ◄ value ► widget. So: real per-value markers on
// the actual dropdown rows where one exists, and an aggregate "changed" dot on
// the live selector widget everywhere (including sequences) — nothing here is
// fabricated; both are genuine baked elements this only decorates.
//
// The dot means "this structure has A change somewhere inside it" — that's
// true whether the change record itself is kind 'frame'/'value' (a frame was
// added/removed/modified) OR a node/wire/structure living inside one of this
// structure's frames (e.g. a node added inside a case's True branch): either
// way `c.frame_path`'s LAST segment is this structure's own uid=value (see
// _frame_locality), so every change with a container_uid counts toward its
// owning structure's dot, not just frame/value-kind ones.
function decorateMenus(){
  // A structure that is ITSELF added/removed gets NO dot: its own dashed
  // outline already covers everything inside it, and an aggregate dot would
  // mislabel an all-new (or all-gone) structure as "changed frames".
  const selfAddRem=new Set(CHANGES
    .filter(c=>c.kind==='structure'&&(c.change==='added'||c.change==='removed'))
    .map(c=>String(c.uid)));
  const byStruct={};
  CHANGES.forEach((c,idx)=>{
    if(!c.container_uid || !c.frame_path) return;
    if(selfAddRem.has(String(c.container_uid))) return;
    const seg=c.frame_path.split(';').pop(), val=seg.slice(seg.indexOf('=')+1);
    (byStruct[c.container_uid]=byStruct[c.container_uid]||[]).push({i:idx, value:val, cls:c.change});
  });

    Object.keys(byStruct).forEach(uid=>{
      byStruct[uid].forEach(({value,cls})=>{
        const opt=pane.querySelector(
          '.lv-menu[data-lv-struct="'+uid+'"] .lv-option[data-lv-value="'+CSS.escape(value)+'"]');

        const rect=opt.querySelector('rect'); if(!rect)return;
        const rx2=parseFloat(rect.getAttribute('x'))+parseFloat(rect.getAttribute('width'));

        opt.appendChild(mk);                  // rides inside the row -- shows/hides WITH the menu
      });
    });
  });
}

// ── Minimap / navigation (RTS-style) ─────────────────────────────────────────
// LIVE inline clones, not rasterised <img> data-URIs — see the CSS note above for
// why (the isolated <img> couldn't resolve the change-highlight CSS vars → black
// boxes). Split shows two minimaps (mmA over BEFORE, mmB over AFTER); overlay/
// before/after show one (mmB), which in overlay stacks both clones and blends
// them with the fader. All entry points are guarded so a failure here can never
// break zoom/pan/sync. Clones re-theme on their own (they inherit <html>'s
// data-theme), so no theme-swap plumbing — only a re-clone when frames toggle.
function mkMirror(svg){
  if(!svg)return null;
  const c=svg.cloneNode(true);
  c.removeAttribute('id');
  c.querySelectorAll('[id]').forEach(n=>n.removeAttribute('id'));
  c.querySelectorAll('.lv-help,script').forEach(n=>n.remove());
  // Drop the live pane's inline width + union-registration margins (applyZoom set
  // them); the minimap sizes the clone from its own viewBox via CSS width:100%.
  c.removeAttribute('style'); c.removeAttribute('width'); c.removeAttribute('height');
  return c;
}
function setLayer(host,svg){ const el=svg?mkMirror(svg):null; host.replaceChildren(...(el?[el]:[])); }
function buildMinimap(){
  if(!mmB)return;
  const bSvg=beforePane.querySelector('svg'), aSvg=afterPane.querySelector('svg');
  const aOver=mmA.querySelector('.mm-over'), aUnder=mmA.querySelector('.mm-under');
  const bOver=mmB.querySelector('.mm-over'), bUnder=mmB.querySelector('.mm-under');
  if(mode==='split'){
    setLayer(aOver,bSvg); setLayer(aUnder,null);
    setLayer(bOver,aSvg); setLayer(bUnder,null);
  }else if(mode==='overlay'){
    setLayer(aOver,null); setLayer(aUnder,null);
    setLayer(bUnder,bSvg); setLayer(bOver,aSvg);   // before behind, after on top
  }else{ // before / after single
    setLayer(aOver,null); setLayer(aUnder,null);
    setLayer(bOver, mode==='before'?bSvg:aSvg); setLayer(bUnder,null);
  }
  applyMinimapBlend();

// Overlay: fade the two stacked clones in lock-step with the pane fader.
function applyMinimapBlend(){
  const over=mmB.querySelector('.mm-over'), under=mmB.querySelector('.mm-under');

    over.style.opacity=v; under.style.opacity=1-v; }
  else { over.style.opacity=''; under.style.opacity=''; }

// Position + viewport rect for ONE minimap over a given scroller/svg. Returns
// false when the whole diagram fits (caller hides it).
function layoutMM(mm, scroller, svg){
  if(!svg)return false;
  const rc=svg.getBoundingClientRect(), contentW=rc.width, contentH=rc.height;
  if(!contentW||!contentH)return false;
  const fx=Math.min(1, scroller.clientWidth/contentW);
  const fy=Math.min(1, scroller.clientHeight/contentH);
  if(fx>=0.999&&fy>=0.999)return false;                 // whole thing visible
  // applyZoom() offsets each pane's svg by a union-registration margin; subtract
  // it to read the viewport in the svg's OWN content coordinates.
  const ml=parseFloat(svg.style.marginLeft)||0, mt=parseFloat(svg.style.marginTop)||0;
  const visX=scroller.scrollLeft-ml, visY=scroller.scrollTop-mt;
  const mmW=mm.clientWidth, mmH=mm.clientHeight, clamp01=v=>Math.max(0,Math.min(1,v));
  const view=mm.querySelector('.mm-view');
  view.style.left  =clamp01(visX/contentW)*mmW+'px';
  view.style.top   =clamp01(visY/contentH)*mmH+'px';
  view.style.width =fx*mmW+'px';
  view.style.height=fy*mmH+'px';

// Pin a minimap to the bottom-right corner of `pane`, in stage-wrap coordinates.

  const wr=stageWrap.getBoundingClientRect(), pr=pane.getBoundingClientRect();

      mmB.hidden=!layoutMM(mmB, afterPane,  afterPane.querySelector('svg'));
    }else{

      mmB.style.right='10px'; mmB.style.bottom='10px'; mmB.style.left='auto'; mmB.style.top='auto';

      // union-registered coordinates, so either is a faithful reference).
      const refPane=(mode==='before'?beforePane:afterPane);
      const scroller=(mode==='overlay')?afterPane:stage;

  const r=mm.getBoundingClientRect();
  const rc=svg.getBoundingClientRect(), contentW=rc.width, contentH=rc.height;
  const ml=parseFloat(svg.style.marginLeft)||0, mt=parseFloat(svg.style.marginTop)||0;
  scroller.scrollLeft=((e.clientX-r.left)/r.width )*contentW+ml-scroller.clientWidth /2;
  scroller.scrollTop =((e.clientY-r.top )/r.height)*contentH+mt-scroller.clientHeight/2;
}
[mmA,mmB].forEach(mm=>{ if(!mm)return;
  let mmDrag=false;
  mm.addEventListener('pointerdown',e=>{ mmDrag=true; mmJump(e,mm); e.preventDefault(); });
  mm.addEventListener('pointermove',e=>{ if(mmDrag) mmJump(e,mm); });
  addEventListener('pointerup',()=>{ mmDrag=false; });
});
if(mmB){
  // Both panes (split) AND the stage (overlay/single) can be the live scroller.
  [beforePane,afterPane,stage].forEach(el=>el.addEventListener('scroll',updateMinimap));
  addEventListener('resize',updateMinimap);
  try{ buildMinimap(); updateMinimap(); }catch(_){ /* minimap optional */ }
  // Re-clone (debounced) when the live diagrams' structure/classes change — a
  // case-frame toggle flips lv-frame-hidden inside a pane svg. Ignore hover-help
  // class flips (the clone strips .lv-help) so a mere hover never re-clones.
  try{
    let rb=null;
    const reclone=recs=>{
      if(recs&&recs.every(r=>{const t=r.target;
        return t&&t.classList&&(t.classList.contains('lv-help')||t.classList.contains('lv-help-shown'));}))return;
      clearTimeout(rb); rb=setTimeout(()=>{ try{ buildMinimap(); updateMinimap(); }catch(_){} },80);
    };
    const mo=new MutationObserver(reclone);
    [beforePane,afterPane].forEach(p=>{const s=p.querySelector('svg');
      if(s)mo.observe(s,{subtree:true,attributes:true,attributeFilter:['class'],childList:true});});
  }catch(_){ /* minimap optional */ }
}

// Deep-link (shareable): #c=N opens change N (1-based); #view=overlay|before|after|split
// sets the mode; #list=flat|tree sets the change-list mode (#31);
// #frame=UID=VAL,UID=VAL pre-selects case frames (correlated).
(function(){
  const h=new URLSearchParams(location.hash.slice(1));
  if(h.get('view')) setMode(h.get('view'));
  if(h.get('list')) setListMode(h.get('list'));
  const fr=h.get('frame');
  if(fr){ fr.split(',').forEach(p=>{const i=p.indexOf('=');
    if(i>0) setFrame(p.slice(0,i), p.slice(i+1));}); }
  if(h.get('c')) jump(+h.get('c')-1);
})();
