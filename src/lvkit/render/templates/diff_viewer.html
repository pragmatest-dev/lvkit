<title>__TITLE__</title>
<style>
  /* Theme is DEFAULT LIGHT (GitHub-light-ish); the whole palette is overridden
     to dark inside @media (prefers-color-scheme: dark) below, so the SAME file
     is light in a light viewer and dark in a dark one. --canvas is the SVG
     backdrop; --btn/--btn-hover are the neutral toolbar/list surfaces;
     --accent is the active/selection blue; --chip-* are the BEFORE/AFTER pane
     labels; --fg-muted is secondary text (the fader end-caps). */
  :root{
    --add:#1a7f37;--del:#cf222e;--mod:#9a6700;
    --bg:#ffffff;--panel:#f6f8fa;--fg:#1f2328;--line:#d0d7de;
    --canvas:#ffffff;--btn:#eaeef2;--btn-hover:#dfe4ea;--fg-muted:#57606a;
    --accent:#0969da;--accent-fg:#ffffff;
    --chip-before:#e7ecf1;--chip-after:#dfe4ea;--chip-border:#c4ccd6;--chip-fg:#1f2328;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --add:#2ea043;--del:#f85149;--mod:#d29922;
      --bg:#0d1117;--panel:#161b22;--fg:#e6edf3;--line:#30363d;
      --btn:#21262d;--btn-hover:#2a3038;--fg-muted:#aeb6c2;
      --accent:#1f6feb;--accent-fg:#e6edf3;
      --chip-before:#2a3038;--chip-after:#20252e;--chip-border:#3a414c;--chip-fg:#ffffff;
    }
  }
  /* DIAGRAM theme only. The ◐/☀/☾ toggle sets data-theme on <html> to re-theme
     the embedded diagram SVGs (their own CSS listens to it). The ONLY chrome
     property allowed to follow the toggle is --canvas — the diagram backdrop,
     visually part of the diagram. ALL other chrome above follows the
     system/editor theme (plain @media) and must NEVER react to data-theme. */
  @media (prefers-color-scheme: dark){ :root:not([data-theme]){--canvas:#1b1c1e} }
  :root[data-theme="dark"]{--canvas:#1b1c1e}
  :root[data-theme="light"]{--canvas:#ffffff}
  *{box-sizing:border-box}
  body{margin:0;font:14px/1.4 system-ui,sans-serif;background:var(--bg);color:var(--fg);
       display:grid;grid-template-rows:auto 1fr;height:100vh}
  header{padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line);
         display:flex;gap:14px;align-items:center;flex-wrap:wrap}
  header b{font-size:15px;white-space:normal;overflow-wrap:anywhere;flex:1 1 auto;min-width:0}
  .t-arr{white-space:nowrap}  /* "→ after" stays together — title breaks before the → */
  /* Header = three groups (titles · controls · legend). Each group is nowrap so
     it never fragments internally; the header's own flex-wrap breaks only
     BETWEEN groups — one row when there's room, three stacked rows when narrow.
     .controls.grow fills the gap between titles and legend (Split/Overlay left,
     zoom/hl/theme right via margin-left:auto); .legend grows just enough to keep
     its chips right-justified on its own row when stacked. */
  /* Title takes the whole first row; controls + legend flow onto the row(s)
     below and wrap among themselves when narrow (header's own flex-wrap).
     The title <b> grows/wraps (flex:1 1 auto above), pushing the properties
     button to this row's right edge — same "button follows the VI name(s)"
     placement as render_viewer.html's .titlerow. */
  .titles{display:flex;gap:14px;align-items:center;flex-wrap:nowrap;flex:0 0 100%}
  .controls{display:flex;gap:6px;align-items:center;flex-wrap:nowrap}
  .controls.grow{flex:100 1 auto}
  .controls.right{margin-left:auto;font-size:14px}   /* zoom/hl/theme cluster */
  .controls.tight{gap:4px}                            /* the Flat/Tree toggles */
  button{background:var(--btn);color:var(--fg);border:1px solid var(--line);border-radius:6px;
         padding:5px 10px;cursor:pointer;font:inherit}
  button.active{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
  button:disabled{opacity:.45;cursor:default}
  /* Icon buttons (highlight toggle + diagram-theme toggle) share one footprint. */
  #hlToggle,.lvkit-theme-btn{min-width:30px;padding:5px 9px}
  /* View-mode toggles in the Changes panel header. */
  .list-toggle-btn{padding:3px 8px;font-size:11px}
  .legend{display:flex;gap:12px;align-items:center;font-size:13px;
          flex-wrap:nowrap;justify-content:flex-end;flex:1 0 auto}
  .chip{display:inline-flex;gap:6px;align-items:center}
  .chip.muted{opacity:.6}
  .sw{width:12px;height:12px;border-radius:3px}
  .sw.add{background:var(--add)}.sw.del{background:var(--del)}.sw.mod{background:var(--mod)}
  .body{display:grid;grid-template-columns:var(--aside-w,290px) 6px 1fr;
        grid-template-rows:minmax(0,1fr);min-height:0}
  aside{background:var(--panel);border-right:1px solid var(--line);overflow:hidden;
        padding:8px;display:flex;flex-direction:column;min-height:0}
  aside h3{margin:8px 6px;font-size:12px;text-transform:uppercase;letter-spacing:.04em;opacity:.6}
  .nav{display:flex;gap:6px;padding:6px}.nav button{flex:1}
  /* "Changes" heading row: title left, Flat/Tree/Expand/Collapse toggles right. */
  .list-head{display:flex;align-items:center;justify-content:space-between;margin:8px 6px}
  .list-head h3{margin:0}
  /* Only the list scrolls; prev/next + Flat/Tree stay pinned (aside is a flex
     column). The netlist Tree can be far taller than the viewport. */
  #list{flex:1 1 auto;overflow-y:auto;overflow-x:auto;min-height:0}
  /* Draggable splitter between the change panel and the canvas — the netlist
     lines are wide, so the panel needs to widen. */
  .divider{cursor:col-resize;background:var(--line)}
  .divider:hover,.divider.drag{background:var(--accent)}
  /* While dragging the splitter, lock the resize cursor + kill text selection
     page-wide via a body state class (not a written-in .style). */
  body.resizing{cursor:col-resize;user-select:none}
  .item{display:flex;gap:8px;align-items:baseline;padding:6px 8px;border-radius:6px;cursor:pointer}
  .item:hover{background:var(--btn)}.item.sel{background:#1f6feb33;outline:1px solid var(--accent)}
  /* Hidden-frame rows: dimmed so the reviewer still sees every change but a
     click-to-switch-frame one distracts less. No pill here — the numbered
     .hl-num badge above the owning structure (and the .frame-opt-dot inside its
     frame dropdown) indicate that a hidden change lives inside it. */
  .item.dimmed{opacity:.6}
  /* Tree view: a scope/frame CONTEXT header (its case/frame is unchanged --
     only its contents changed) has no matching CHANGES entry, so it's not
     clickable -- there is no ElementChange to jump() to. A row that DOES
     correlate to a real node/wire/structure/frame change keeps the plain
     .item look (clickable). */
  .item.header{cursor:default}
  .item.header:hover{background:none}
  .num{font-variant-numeric:tabular-nums;opacity:.6;min-width:20px}
  .tag{font-size:11px;padding:1px 5px;border-radius:4px;font-weight:600}
  .tag.added{background:var(--add)}.tag.removed{background:var(--del)}.tag.modified{background:var(--mod)}
  .lbltxt{flex:1;min-width:0}
  .lbl{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  /* The change spelled out after the element (added/removed/modified), coloured
     to the change grammar; lighter weight so the element still leads the row. */
  .chgword{font-weight:400;opacity:.72}
  .chgword.added{color:var(--add)}.chgword.removed{color:var(--del)}.chgword.modified{color:var(--mod)}
  .detail{font-size:11px;opacity:.62;font-variant-numeric:tabular-nums;
          overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:1px}
  /* Tree view (Phase 3): row text is netlist SYNTAX (instance_line/
     scope_header from diff.py), so it reads monospace like code/a diff. */
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  /* Tree mode: netlist lines are WIDE -- do NOT ellipsis-truncate them. Each row
     grows to its content width and #list scrolls horizontally (panel also resizes
     via the divider). Flat mode keeps its ellipsis (short labels). */
  #list.tree .item{width:max-content;min-width:100%}
  #list.tree .lbl.mono{overflow:visible;text-overflow:clip;white-space:pre}
  #list.tree .lbltxt{flex:0 0 auto}
  /* Tree view (Phase 4): a REAL nested collapsible tree -- folders (scope/
     frame rows) own a .tchildren container holding their nested children,
     purely for COLLAPSE logic (display:none while collapsed). It carries NO
     visual indent of its own -- indent is a per-row .tindent spacer sized
     from the row's own depth (see rowContent/buildTreeDOM below), so the
     number badge + change tag ahead of it stay pinned at the list's left
     edge at every depth (#42: they used to travel with the indented row). */
  #list.tree .tnode{position:relative}
  #list.tree .tchildren{margin:0;padding:0}
  #list.tree .tnode.collapsed>.tchildren{display:none}
  /* Compact, file-tree-like spacing in Tree mode only (Flat keeps the base
     8px .item gap) -- both the per-level indent step (tindent's inline
     width, ~13px) and the gap between the chevron and the netlist text. */
  #list.tree .item{gap:4px}
  .tindent{display:inline-block;flex:0 0 auto}
  .tchev{display:inline-block;width:13px;flex:0 0 auto;text-align:center;
         cursor:pointer;opacity:.65;transition:transform .15s;user-select:none}
  .tchev:hover{opacity:1}
  /* A leaf has no chevron to show, but keeps an empty same-width .tchev so
     its glyph+text lines up with a folder row's at the same depth. */
  .tchev.leaf{cursor:default;opacity:0}
  .tchev.leaf:hover{opacity:0}
  #list.tree .tnode.collapsed>.item>.tchev{transform:rotate(-90deg)}
  /* stage-wrap is the .body grid's 1fr child; the stage fills it absolutely so
     the minimap can pin over the canvas corner without scrolling with it. */
  .stage-wrap{position:relative;overflow:hidden;min-height:0}
  .stage{position:absolute;inset:0;padding:16px;overflow:auto}
  .pane{position:relative}
  /* Minimap / navigation overlay (RTS-style), pinned over a canvas corner. Each
     thumbnail is a LIVE inline CLONE of a pane's diagram SVG (not a rasterised
     data-URI), so it inherits the page CSS — including the change-highlight vars
     (--add/--del/--mod) that an isolated <img> couldn't resolve (they fell back
     to black) — and re-themes with <html>'s data-theme. Split shows TWO (one per
     pane, each over its own corner); overlay/before/after show ONE (mmB), which
     in overlay stacks both mirrors (mm-under=before, mm-over=after) and blends
     them with the same fader. Plain chrome tokens only — never data-theme. */
  .minimap{position:absolute;right:10px;bottom:10px;width:180px;max-width:45%;
    background:var(--panel);border:1px solid var(--line);border-radius:6px;
    box-shadow:0 2px 12px rgba(0,0,0,.28);overflow:hidden;z-index:65;cursor:pointer}
  .minimap[hidden]{display:none}
  /* mm-over is in flow (establishes the panel height); mm-under overlays it
     exactly (same viewBox → same box) for the Overlay blend. */
  .mm-over{position:relative;z-index:1;display:block;font-size:0}
  .mm-under{position:absolute;inset:0;z-index:0;display:block;font-size:0}
  .mm-over svg,.mm-under svg{display:block;width:100%;height:auto;max-width:100%;
    background:none;border-radius:0;margin:0}
  .mm-view{position:absolute;z-index:2;border:2px solid var(--accent);border-radius:2px;
    background:var(--accent);opacity:.22;pointer-events:none}
  .zoomgrp{display:inline-flex;gap:2px;align-items:center;margin-left:2px}
  .zoomgrp button{padding:5px 9px;min-width:30px;font-weight:600}
  .pane-label{position:sticky;top:8px;left:8px;z-index:60;display:inline-block;width:max-content;
    font:700 11px system-ui,sans-serif;letter-spacing:.05em;padding:3px 9px;border-radius:11px;
    color:var(--chip-fg);pointer-events:none;box-shadow:0 1px 4px #0009}
  /* Neutral, not the add/remove hues — those are reserved for the change
     grammar. BEFORE/AFTER text is what distinguishes the two panes. */
  .pane-label.before{background:var(--chip-before);border:1px solid var(--chip-border)}
  .pane-label.after{background:var(--chip-after);border:1px solid var(--chip-border)}
  /* Overlay = the SAME split idea (label OUTSIDE its scroll box), superimposed.
     Both wraps reserve equal top+bottom bands (padding) so the two scroll boxes line
     up and the diagrams register. BEFORE is pinned in the top band (fixed header),
     AFTER in the bottom band (fixed footer) — the scroll box between them has a max
     height (view minus both bands); the diagram grows with zoom until it exceeds
     that box, then scrolls WITHIN it, never under either label. Panes are synced
     (scrollTargets includes overlay). */
  .stage.overlay{display:grid;overflow:hidden}
  /* align-self:start + max-height:100% => the wrap sizes to its CONTENT, but never
     taller than the view. So the scroll box grows with the diagram (AFTER hugging
     its bottom, no gap) until it hits that max, then the pane (flex 1 1 auto,
     min-height:0) can't grow further and scrolls WITHIN — AFTER still pinned to its
     bottom. */
  .overlay .pane-wrap{grid-area:1/1;align-self:start;max-height:100%;min-height:0;
    position:relative;display:flex;flex-direction:column;padding:26px 0;box-sizing:border-box}
  .overlay .pane{flex:1 1 auto;min-height:0;overflow:auto}
  .overlay #beforeWrap>.pane-label{position:absolute;top:5px;bottom:auto;left:12px;z-index:60;transform:none}
  .overlay #afterWrap>.pane-label{position:absolute;top:auto;bottom:5px;left:12px;z-index:60;transform:none}
  /* pointer-events on before/after are NOT static here — applyBlend() (script,
     below) flips them to match whichever side the fader currently favours, so
     a click always lands on the pane that's actually dominant on screen. */
  .mode-before #afterWrap,.mode-after #beforeWrap{display:none}
  /* Split view synced (tied-pan): before above after, full width each, each pane its
     OWN scrollable viewport — a shared pan window keeps them on the same LV
     region (see mirrorScroll + scrollTargets in the script below). */
  /* pane-wrap = [label header][scrolling pane]. The label sits OUTSIDE the pane's
     scroll box (a header strip), so the diagram can never scroll under it. Each
     pane (beforePane/afterPane) stays its OWN overflow:auto box — scrollTargets +
     mirrorScroll key off those, so per-svg linked scrolling is unchanged. */
  .pane-wrap{position:relative;min-width:0}
  .stage.split{display:flex;flex-direction:column;gap:16px}
  .stage.split .pane-wrap{flex:1 1 0;min-height:0;display:flex;flex-direction:column}
  .stage.split .pane{flex:1 1 0;min-height:0;overflow:auto}
  /* Header strip: in flow (own space, always visible like a sticky header), z above
     the pane, pulled down a hair so it slivers over the diagram's top edge only. */
  .stage.split .pane-label{position:relative;z-index:60;flex:0 0 auto;
    align-self:flex-start;transform:none;margin:0 0 -9px 2px}
  svg{max-width:none;height:auto;background:var(--canvas);border-radius:6px}
  /* The diagram svg must NEVER flow inline beside the (in-flow, sticky) pane
     label: when tied-zoom makes one svg narrower than its pane, an inline svg
     hops up next to the label — different label widths in the two panes then
     break the before/after registration in Overlay. Block flow pins every
     diagram to x=0 on its own line. (Outer svg only — nested SVGs inside the
     diagram lay out in SVG coordinates, untouched.) */
  .pane > svg{display:block}
  /* Region fill is a SELECTION-ONLY affordance (req #3) — the add/remove/modify
     border/outline always shows (stroke-opacity:1 below), but the translucent
     region wash only appears once a change is picked (see .hl.sel further down). */
  .hl{pointer-events:none;fill-opacity:0;stroke-opacity:1;transition:fill-opacity .2s,stroke-opacity .2s}
  .hl.node.added{fill:var(--add);stroke:var(--add);stroke-width:2}
  .hl.node.removed{fill:var(--del);stroke:var(--del);stroke-width:2}
  .hl.node.modified{fill:var(--mod);stroke:var(--mod);stroke-width:2}
  /* A constant is a small node-like box on the diagram — same filled highlight
     as a node (added/removed/modified alike), keyed by change grammar. */
  .hl.constant.added{fill:var(--add);stroke:var(--add);stroke-width:2}
  .hl.constant.removed{fill:var(--del);stroke:var(--del);stroke-width:2}
  .hl.constant.modified{fill:var(--mod);stroke:var(--mod);stroke-width:2}
  /* An FP control/indicator terminal is a node-like box on the diagram — same
     filled highlight as a node (added/removed/modified alike). */
  .hl.terminal.added{fill:var(--add);stroke:var(--add);stroke-width:2}
  .hl.terminal.removed{fill:var(--del);stroke:var(--del);stroke-width:2}
  .hl.terminal.modified{fill:var(--mod);stroke:var(--mod);stroke-width:2}
  .hl.structure{fill:none;stroke-width:3;stroke-dasharray:7 4}
  .hl.structure.added{stroke:var(--add)}.hl.structure.removed{stroke:var(--del)}
  .hl.structure.modified{stroke:var(--mod)}
  /* A change whose frame isn't currently shown is GHOSTED (faint .offframe box +
     badge at its on-node bounds), not hidden — so every change stays visible in
     the unselected state and reappears at full strength when its frame is shown
     (see updateParkState() + .hl.offframe). The owning selector also carries an
     aggregate "changed" dot below. */
  /* Per-value markers on a structure's dropdown menu rows, when the renderer
     exposes one (case structures only — see decorateMenus()). The aggregate
     "this structure's frame set changed" indicator is the numbered .hl-num
     badge above the selector (see CHANGES.forEach), same as every other change. */
  .frame-opt-dot{stroke:#0d1117;stroke-width:.6;pointer-events:none}
  .frame-opt-dot.added{fill:var(--add)}.frame-opt-dot.removed{fill:var(--del)}
  .frame-opt-dot.modified{fill:var(--mod)}
  /* Wire changes: a ringed pin at the sink terminal (grammar hue = change type). */
  .hl.wire{fill-opacity:.9;stroke:#0d1117;stroke-width:1.5;paint-order:stroke}
  .hl.wire.added{fill:var(--add)}.hl.wire.removed{fill:var(--del)}
  .hl.wire.modified{fill:var(--mod)}
  /* Faithful wire/chain polyline overlays: hue = change type, solid = current. */
  /* Slightly transparent at rest so the real wire reads through the colour
     overlay (matches the node fill's translucency); the selected wire goes fully
     opaque below (.hl.wirepath.sel). */
  .hl.wirepath{fill:none;fill-opacity:0;stroke-opacity:.8;stroke-width:3.5;stroke-linejoin:round;stroke-linecap:round}
  .hl.wirepath.added{stroke:var(--add)}.hl.wirepath.removed{stroke:var(--del)}
  .hl.wirepath.modified{stroke:var(--mod)}
  .hl.wirepath.old{stroke-dasharray:7 5;display:none}   /* old routing — only when selected */
  .hl.wirepath.old.sel{display:inline}
  .hl.wirepath.chain{display:none}                      /* node's chain — only when selected */
  /* chain wires are CONTEXT (they belong to the node) — lighter + thinner than a
     primary wire CHANGE, which stays full-strength. */
  .hl.wirepath.chain.sel{display:inline;stroke-opacity:.45;stroke-width:2.5}
  .hl.wirepath.sel{stroke-width:5;stroke-opacity:1}
  /* Primary selected wire pulses in lockstep with node/structure changes (parity);
     the dashed OLD routing and faint CHAIN context stay steady. */
  .hl.wirepath.sel:not(.old):not(.chain){animation:selpulse 1.25s ease-in-out infinite}
  .hl-num{pointer-events:none;font:bold 17px system-ui,sans-serif;
          paint-order:stroke;stroke:#0d1117;stroke-width:4;stroke-linejoin:round;
          transition:opacity .2s}
  .hl-num.added{fill:var(--add)}.hl-num.removed{fill:var(--del)}.hl-num.modified{fill:var(--mod)}
  /* Highlights OFF (the ◉ toggle): hide with visibility, NOT display —
     geometry must stay measurable so focus()/navigation keep working, and
     visibility wins over the display-based .sel reveal rules, so selected
     wire overlays (wirepath/chain/old) obey the toggle too. */
  .hide-hl .hl,.hide-hl .hl-num,.hide-hl .frame-opt-dot{visibility:hidden}
  /* Spotlight: once a change is picked, fade every OTHER highlight + badge. */
  .stage.has-sel .hl:not(.sel){fill-opacity:.05;stroke-opacity:.22}
  .stage.has-sel .hl-num:not(.sel){opacity:.18}
  /* Off-frame changes: kept visible but GHOSTED (faint outline / dim badge) in
     the unselected state, so a change in a not-currently-shown frame still
     reads as "there's a change over there" instead of vanishing. */
  /* Off-frame wins over .sel + the spotlight: a change whose node isn't on
     screen must GHOST even when selected, or a full-strength box falsely brands
     whatever now occupies that spot as the change. */
  .hl.offframe,.hl.offframe.sel{stroke-opacity:.24!important;fill-opacity:0!important;filter:none!important;animation:none!important}
  .hl-num.offframe,.hl-num.offframe.sel{opacity:.32!important}
  /* Chain wires are hidden until selected; also hide them when off-frame, so a
     selected node whose frame you navigated away from shows no dangling wires. */
  .hl.wirepath.chain.offframe{display:none!important}
  /* Selected change KEEPS its add/remove colour; stands out via spotlight-dim +
     same-colour glow + pulse, never by recolouring. */
  /* Selection reads via the RING + others dimming, never a heavier fill: keep the
     selected fill LIGHTER than the calm .24 overlay so the node/text stays legible
     underneath, and use a single soft glow instead of a stacked halo. */
  .hl.node.sel,.hl.structure.sel,.hl.constant.sel,.hl.terminal.sel{stroke-width:4;stroke-dasharray:none;stroke-opacity:1;
          fill-opacity:.2;paint-order:stroke;animation:selpulse 1.25s ease-in-out infinite}
  .hl.wire.sel{stroke:#fff;stroke-width:2.5;fill-opacity:1;animation:selpulse 1.25s ease-in-out infinite}
  .hl.added.sel{filter:drop-shadow(0 0 4px var(--add))}
  .hl.removed.sel{filter:drop-shadow(0 0 4px var(--del))}
  .hl.modified.sel{filter:drop-shadow(0 0 4px var(--mod))}
  .hl-num.sel{font-size:24px;stroke-width:5}
  @keyframes selpulse{0%,100%{stroke-width:3.5}50%{stroke-width:7}}
  /* DJ-deck fader: a long, chunky, tactile cross-fade slider — restyled from
     the default hairline <input type=range>. Height matches the other toolbar
     buttons (31.6px, same box model as the plain `button` rule above) so the
     whole controls row reads as one uniform, vertically-aligned toolbar. */
  #opWrap{display:flex;align-items:center;gap:8px;height:31.6px}
  /* id-specificity so the hidden attribute (overlay off) beats the flex rule. */
  #opWrap[hidden]{display:none}
  #opWrap .op-end{height:31.6px;display:inline-flex;align-items:center;justify-content:center;
          font:600 11px/1 system-ui,sans-serif;letter-spacing:.04em;text-transform:uppercase;
          color:var(--fg-muted);background:var(--btn);border:1px solid var(--line);border-radius:6px;
          padding:0 10px;cursor:pointer}
  #opWrap .op-end:hover{color:var(--fg);border-color:var(--line);background:var(--btn-hover)}
  #op{-webkit-appearance:none;appearance:none;width:150px;height:31.6px;margin:0;
      background:linear-gradient(90deg,#2a3038,#3a414c);border:1px solid var(--line);
      border-radius:11px;outline:none;cursor:grab;box-shadow:inset 0 2px 4px #0009}
  #op:active{cursor:grabbing}
  #op::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:16px;height:26px;
      border-radius:4px;background:linear-gradient(180deg,#f0f3f7,#c4cad4);
      border:1px solid #40464f;box-shadow:0 2px 6px #000a,inset 0 1px 0 #fff9;cursor:grab}
  #op::-webkit-slider-thumb:active{cursor:grabbing;background:linear-gradient(180deg,#dfe4ea,#aeb5c0)}
  #op::-moz-range-track{background:transparent;border:none}
  #op::-moz-range-thumb{width:16px;height:26px;border-radius:4px;
      background:linear-gradient(180deg,#f0f3f7,#c4cad4);border:1px solid #40464f;
      box-shadow:0 2px 6px #000a,inset 0 1px 0 #fff9;cursor:grab}
</style>

<header>

<script>
// Resizable sidebar (drag the divider) -- the netlist Tree can be tall AND wide.
(function(){
  const body=document.querySelector('.body'),div=document.getElementById('divider');
  let drag=false;
  div.addEventListener('mousedown',e=>{drag=true;div.classList.add('drag');
    document.body.style.cursor='col-resize';document.body.style.userSelect='none';
    e.preventDefault();});
  window.addEventListener('mousemove',e=>{if(!drag)return;
    const w=Math.max(180,Math.min(e.clientX,window.innerWidth*0.6));
    body.style.setProperty('--aside-w',w+'px');});
  window.addEventListener('mouseup',()=>{if(!drag)return;drag=false;
    div.classList.remove('drag');
    document.body.style.cursor='';document.body.style.userSelect='';});
})();

<script>
const CHANGES = __CHANGES__;
// Structured netlist-diff rows (diff.py's NetlistDiffRow, JSON via
// rows_to_json()) -- the SAME rows format_diff renders to text, so the Tree
// view (below) can render the identical diff instead of regrouping CHANGES
// client-side (see .tmp/netlist-spec.md Phase 3). [] when the CLI didn't
// pass any (e.g. an older caller, or no changes at all).
const NETLIST_TREE = __NETLIST_TREE__;
const SVGNS='http://www.w3.org/2000/svg';
const stage=document.getElementById('stage');
const afterPane=document.getElementById('afterPane'), beforePane=document.getElementById('beforePane');
const mmA=document.getElementById('mmA');  // split-only: mirrors the BEFORE pane
const mmB=document.getElementById('mmB');  // universal: after / before / overlay(both)
const stageWrap=stage.parentElement;       // .stage-wrap (positioning context)

// added lives in after (bounds are after's); removed lives in before.
function paneFor(c){ return c.change==='removed' ? beforePane : afterPane; }

// Highlights come STRAIGHT from the engine change-map's bounds — absolute LV
// pixels, the same space as each SVG's viewBox — so a rect placed at those
// coordinates lands exactly on the node. No getBBox / data-node scrape, no
// union-of-fragments, no help-layer exclusion (bounds = one node = one box).
// bounds = [x1,y1,x2,y2] in the version the change appears in (added→after,
// removed→before), matching paneFor.
function layerOf(svg){
  let g=svg.querySelector('.hl-layer');
  if(!g){g=document.createElementNS(SVGNS,'g');g.setAttribute('class','hl-layer');svg.appendChild(g);}
  return g;
}
// rects/nums/layers hold the PRIMARY highlight (the one focus() centres on);
// ghosts holds the mirror box a "modified" change also gets in the BEFORE pane, so
// Split / Overlay read as a before → after pair.
const rects={}, nums={}, layers={}, ghosts={}, parts={};
// The renderer bakes every structure's selector as a clickable
// <g class="lv-selector" data-lv-action="toggle" data-lv-struct="UID"> widget —
// same identity token as ElementChange.container_uid — so its live on-screen
// geometry (getBBox, absolute SVG-viewBox units, no transforms anywhere in this
// renderer) doubles as a focus() anchor for changes with no node of their own
// (kind 'frame'/'value') and as the mount point for decorateMenus()'s aggregate
// "changed" dot — the ONLY decoration this viewer ever draws on a selector.
const _selBoxCache={};
function selectorEl(pane, uid){
  return uid ? pane.querySelector(
    '.lv-selector[data-lv-action="toggle"][data-lv-struct="'+uid+'"]') : null;
}
function selectorBounds(pane, uid){
  if(!uid)return null;
  const key=(pane===beforePane?'bef:':'aft:')+uid;
  if(key in _selBoxCache)return _selBoxCache[key];
  let box=null;
  try{
    const el=selectorEl(pane, uid);
    if(el){const b=el.getBBox(); box=[b.x,b.y,b.x+b.width,b.y+b.height];}
  }catch(e){ box=null; }
  _selBoxCache[key]=box;
  return box;
}
// A faithful wire polyline overlay (change-map `path`): a coloured stroke tracing
// the real drawn wire. Used for wire changes AND for a node's incident "chain"
// wires. label=null draws no badge (chain wires ride under the node's number).
function drawPoly(pane, points, cls, label){
  const svg=pane.querySelector('svg'); if(!svg||!points||points.length<2)return null;
  const layer=layerOf(svg);
  const d=points.map((p,k)=>(k?'L':'M')+p[0]+' '+p[1]).join(' ');
  const path=document.createElementNS(SVGNS,'path');
  path.setAttribute('d',d);
  path.setAttribute('class','hl wirepath '+cls);
  path.setAttribute('vector-effect','non-scaling-stroke');
  layer.appendChild(path);
  let t=null;
  if(label!=null){
    const [lx,ly]=points[points.length-1];   // badge at the sink end
    t=document.createElementNS(SVGNS,'text');
    t.setAttribute('x',lx-11);t.setAttribute('y',ly-13);
    t.setAttribute('class','hl-num '+cls);
    t.textContent=label;
    layer.appendChild(t);
  }
  return {r:path, t, layer};
}
function drawBox(pane, bounds, cls, label){
  const svg=pane.querySelector('svg'); if(!svg)return null;
  const layer=layerOf(svg);
  const [x1,y1,x2,y2]=bounds;
  let r, bx=x1, by=y1;
  if(cls.includes('wire')){
    // Wire changes anchor at the SINK terminal — a point, not a box (full-wire
    // colouring awaits faithful geometry, #84). Draw a ringed pin there.
    r=document.createElementNS(SVGNS,'circle');
    r.setAttribute('cx',x1);r.setAttribute('cy',y1);r.setAttribute('r',9);
    r.setAttribute('class','hl '+cls);
    r.setAttribute('vector-effect','non-scaling-stroke');
    bx=x1-11; by=y1-11;
  }else{
    const pad=cls.includes('structure')?3:5;
    r=document.createElementNS(SVGNS,'rect');
    r.setAttribute('x',x1-pad);r.setAttribute('y',y1-pad);
    r.setAttribute('width',(x2-x1)+2*pad);r.setAttribute('height',(y2-y1)+2*pad);
    r.setAttribute('rx',6);
    r.setAttribute('class','hl '+cls);
    r.setAttribute('vector-effect','non-scaling-stroke');  // crisp stroke when zoomed
    bx=x1-pad; by=y1-pad;
  }
  layer.appendChild(r);
  const t=document.createElementNS(SVGNS,'text');   // correlated number badge (#110)
  t.setAttribute('x',bx);t.setAttribute('y',by-4);
  t.setAttribute('class','hl-num '+cls);
  t.textContent=label;
  layer.appendChild(t);
  return {r, t, layer};
}
const frameNumCol={};   // per-(pane,structure) column counter for stacked frame badges
CHANGES.forEach((c,i)=>{
  const cls=c.kind+' '+c.change;
  const pane=paneFor(c);
  parts[i]=[];
  if(c.kind==='frame'||c.kind==='value'){
    // A frame/value change has no node of its own — number it above its owning
    // structure's selector with the SAME .hl-num badge every other change gets
    // (pointer-events:none; it selects via the change list / normal path). Several
    // changes on one structure lay out in a row. The selector is always on screen,
    // so this badge is NOT frame-parked (offframe) the way on-node badges are.
    const box=selectorBounds(pane, c.container_uid);
    if(box){
      const key=(pane===beforePane?'b':'a')+c.container_uid;
      const col=(frameNumCol[key]=(frameNumCol[key]||0)+1)-1;
      const layer=layerOf(pane.querySelector('svg'));
      const t=document.createElementNS(SVGNS,'text');
      t.setAttribute('x',box[0]+2+col*15); t.setAttribute('y',box[1]-6);
      t.setAttribute('class','hl-num '+cls); t.textContent=i+1;
      layer.appendChild(t); nums[i]=t; layers[i]=layer;
    }
  } else if(c.kind==='wire'){
    // Wire change: overlay the faithful drawn wire, coloured by change type.
    if(c.path){
      // NB: polylines carry ONLY the change class (added/removed/modified) —
      // never the kind (node/wire/structure), whose fill rules (.hl.node.added,
      // .hl.wire.removed) would fill the open path into a solid blob.
      const prim=drawPoly(pane, c.path, c.change, i+1);
      if(prim){
        rects[i]=prim.r; nums[i]=prim.t; layers[i]=prim.layer;
        // Reassigned: the OLD routing as a dashed ghost, drawn on the SAME pane
        // as the new (the sink is unchanged, so it aligns) and revealed on
        // select — so solid-new + dashed-old read together in any view, not
        // split across panes.
        if(c.change==='modified' && c.path_before)
          ghosts[i]=drawPoly(pane, c.path_before, c.change+' old', null);  // no 2nd badge
      }
    }
  } else if(c.bounds){
    const prim=drawBox(pane, c.bounds, cls, i+1);
    if(prim){
      rects[i]=prim.r; nums[i]=prim.t; layers[i]=prim.layer;
      // The node's "chain": its incident wires, drawn in the node's colour so an
      // added/removed node reads as one connected unit (node + its wiring), not
      // a lone box. They carry no badge — they belong to the node's change
      // number. Chains for LEAF nodes only. A structure's incident wires are
      // its border tunnels — pre-existing dataflow merely enclosed by the new
      // container, NOT new connections — so they must never read as "added"
      // (green). Only genuinely new leaf-node wiring is a chain.
      if(c.kind!=='structure') (c.chain_paths||[]).forEach(pp=>{
        // 'chain' → hidden at rest; revealed only when this node is selected.
        const w=drawPoly(pane, pp, c.change+' chain', null); if(w) parts[i].push(w.r);
      });
      // A modified node lives in BOTH versions: mirror it into the before pane.
      if(c.change==='modified' && c.bounds_before)
        ghosts[i]=drawBox(beforePane, c.bounds_before, cls, i+1);
    }
  }
  // A node/wire/structure change whose frame isn't the pane's current selection
  // is GHOSTED (its box+badge get .offframe via updateParkState()) rather than
  // hidden — so it still reads at a glance in the unselected state, then snaps
  // to full strength when the reviewer navigates to its frame. The owning
  // selector's aggregate "changed" dot (decorateMenus()) marks it too.
});

// ── Change list: Flat / Tree (#31, Phase 3) ─────────────────────────────
// Flat is today's behaviour: one numbered row per CHANGES entry, in engine
// order. Tree renders NETLIST_TREE -- the SAME structured netlist-diff rows
// (diff.py's NetlistDiffRow, built server-side by netlist_diff_rows() and
// serialized via rows_to_json()) that back the TEXT report (format_diff) --
// so Tree finally shows the IDENTICAL diff as `lvkit diff`'s text output,
// not a client-side reconstruction of CHANGES by frame_path (see
// ``.tmp/netlist-spec.md`` Phase 3). Flat's own row rendering (kind glyph,
// flat label) is untouched and stays its own visual language.
const list=document.getElementById('list');
const esc=s=>s.replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));
// Truncate a subtext VALUE to n chars (ellipsis); the full value rides in the
// row's title= tooltip. A selector value / constant string can be arbitrarily
// long, so the list stays scannable while the diagram/hover still has it all.
const trunc=(s,n)=>{s=String(s); return s.length>n ? s.slice(0,n-1)+'…' : s;};
// KIND is orthogonal to the +/−/~ CHANGE tag — which of node/wire/structure
// this change IS, not what happened to it. This viewer's OWN glyph scheme
// for the change-list UI (independent of the TEXT report's netlist-syntax
// rendering -- see the note above). A "frame"/
// "value"-kind change has no glyph of its own — the quoted frame token
// ("True":) is its own visual tell (see frameHeaderRow below). property/
// health/signature mirror diff.py's own text glyphs (``_METADATA_GLYPH``/
// ``_TERMINAL_GLYPH``) -- a signature change IS a connector-pane terminal,
// the same kind of thing a control/indicator change is.
const KIND_GLYPH={node:'◻', wire:'↔', structure:'⬚', constant:'○', frame:'⬚', value:'⬚',
  terminal:'▭', property:'▤', health:'▤', signature:'▭'};
const CHANGE_TAG={added:'+', removed:'−', modified:'~'};
// The change spelled out in words, after the element — redundant with the +/−/~
// tag by design (the user asked for the explicit text form), coloured to match.
const CHANGE_WORD={added:'added', removed:'removed', modified:'modified'};
function kindPrefix(kind){ return KIND_GLYPH[kind] ? KIND_GLYPH[kind]+' ' : ''; }
function changeRowHtml(i){
  const c=CHANGES[i];
  // Uniform row = glyph + ELEMENT words (primary), then the VALUE as truncated
  // subtext (full value on hover). Frame/value rows name the element ("case
  // frame") with the selector value / old→new below — instead of a bare quoted
  // value — so they read glyph+words like "○ str constant" / "◻ <node>". A
  // modified node/wire/constant carries its own value/transition the same way.
  // The +/−/~ change tag lives in its own column.
  // ONE RULE, every row: "<type of thing> <change word>" as the primary line,
  // the specific identity/value as truncated subtext. The type word comes from
  // whichever field the engine put it in (frames: element; constants/
  // property/health/signature: label is already the identity -- a field name
  // ("lock"), a curated flag ("broken"), or "{direction} {name}"
  // ("input Tree"); node/wire/structure: the kind noun); the identity is the
  // OTHER field (frame value, constant value, node/structure name, or the
  // property/health/signature's own old->new transition).
  const KIND_WORD={node:'node', wire:'wire', structure:'structure'};
  const LABEL_IS_TYPE={constant:1, property:1, health:1, signature:1};
  const type = c.element || (LABEL_IS_TYPE[c.kind] ? c.label : (KIND_WORD[c.kind]||c.kind));
  const sub = c.element ? (c.detail||c.label) : (LABEL_IS_TYPE[c.kind] ? c.detail : c.label);
  const detail = sub
    ? '<div class="detail" title="'+esc(sub)+'">'+esc(trunc(sub, 32))+'</div>' : '';
  const prim = kindPrefix(c.kind)+esc(type)+
    ' <span class="chgword '+c.change+'">'+CHANGE_WORD[c.change]+'</span>';
  return '<span class="num">'+(i+1)+'</span>'+
    '<span class="tag '+c.change+'">'+CHANGE_TAG[c.change]+'</span>'+
    '<div class="lbltxt"><span class="lbl">'+prim+'</span>'+detail+'</div>';
}
function rowEl(i, indent, html){
  const d=document.createElement('div');
  d.className='item'+(i==null?' header':'');
  if(i!=null){ d.dataset.i=i; d.dataset.k=CHANGES[i].kind; d.dataset.d=CHANGES[i].change; d.onclick=()=>jump(i); }
  // Fixed 8px gutter so the number + change-type tag stay LEFT-JUSTIFIED (aligned
  // straight down the column); tree nesting indents only the label, not the gutter.
  d.style.paddingLeft='8px';
  d.innerHTML=html;
  if(indent){ const lt=d.querySelector('.lbltxt'); if(lt) lt.style.marginLeft=(indent*16)+'px'; }
  return d;
}
function renderFlatList(){
  list.innerHTML='';
  CHANGES.forEach((c,i)=>list.appendChild(rowEl(i, 0, changeRowHtml(i))));
}

// uid -> CHANGES index, built once. NETLIST_TREE rows carry the SAME stable
// uid ElementChange.uid does (a node/wire/structure leaf, or a frame/value
// change's own uid for a changed frame header) -- so this map is how a
// netlist row reaches back into CHANGES for the click-to-navigate path. A
// CONTEXT header (an unchanged case/frame that merely contains changes, row
// change===null) keeps its structure's real uid too, but that uid has no
// live entry in CHANGES (diff_uid only emits actual changes), so it simply
// won't be found here -- correctly falling back to non-clickable, same as a
// row with no uid at all. First uid wins (diff_uid never emits two live
// changes sharing one uid).
const UID_TO_CHANGE_I={};
CHANGES.forEach((c,i)=>{ if(c.uid!=null && !(c.uid in UID_TO_CHANGE_I)) UID_TO_CHANGE_I[c.uid]=i; });

// One row per NETLIST_TREE entry, straight through in diff.py's own
// containment-recursion order (_netlist_diff) -- no client-side regrouping.
// Gutter is the row's own change tag, or a hidden (context) swatch when
// change is null -- an unchanged case/frame that merely CONTAINS changes,
// exactly like the text report's SPACE gutter. Text is netlist syntax
// (instance_line/scope_header, from diff.py), rendered monospace.
// Tree rows mirror the Flat rows' annotations so switching Flat<->Tree keeps the
// SAME items -- just nested. Same number badge (correlates to the on-diagram
// badge, click-to-spotlight), same +/-/~ tag, and the kind ICON leads the line
// (◻ node / ↔ wire / ⬚ scope) -- node-centric, visually parseable. The text
// is node-first netlist syntax (instance_line/scope_header from diff.py). Context
// folder rows (an unchanged case/frame that only contains changes) have no
// CHANGES entry, so no number -- the ⬚/quoted label reads as the folder.
// constant/terminal/property/health/signature all bake their own glyph into
// the row text (via _constant_leaf_text/_terminal_leaf_text/
// _metadata_leaf_text), so their TREE_GLYPH is empty — no double glyph.
const TREE_GLYPH={node:'◻ ', wire:'↔ ', scope:'⬚ ', frame:'', constant:'', terminal:'',
  property:'', health:'', signature:''};
// A row is a FOLDER (has descendants, gets a disclosure chevron + .tchildren
// container) iff its kind is scope/frame -- the netlist tree is already
// pruned server-side so every scope/frame row leads to a change somewhere
// under it. node/wire/constant rows are always LEAVES.
function isFolderRow(row){ return row.kind==='scope' || row.kind==='frame'; }
// Shared row content (number badge / +-~ tag / kind glyph / mono netlist
// text) -- IDENTICAL for a folder header and a leaf, so switching Flat<->Tree
// (or folder<->leaf) never drops an annotation (#31 regression this rebuild
// must not repeat). Split into `gutter` (number + change tag -- ALWAYS the
// row's first two children, so it renders at the same x for every row
// regardless of depth/folder-vs-leaf -- #42) and `text` (kind glyph + mono
// netlist text, the part that actually indents). Returns the resolved
// CHANGES index too (or null -- a context row with no live ElementChange,
// e.g. an unchanged case that only CONTAINS changes).
function rowContent(row){
  const ci=(row.uid!=null && row.uid in UID_TO_CHANGE_I) ? UID_TO_CHANGE_I[row.uid] : null;
  const num='<span class="num">'+(ci!=null?(ci+1):'')+'</span>';
  const tagHtml=row.change
    ? '<span class="tag '+row.change+'">'+CHANGE_TAG[row.change]+'</span>'
    : '<span class="tag" style="visibility:hidden">+</span>';
  const glyph=TREE_GLYPH[row.kind]||'';
  const text='<div class="lbltxt"><span class="lbl mono">'+glyph+esc(row.text)+'</span></div>';
  return {ci, gutter:num+tagHtml, text};
}
// Reconstruct parent/child NESTING from NETLIST_TREE's flat pre-order rows:
// a row is a child of the nearest PRECEDING row with depth-1 -- a stack of
// "open" ancestor nodes, popped back to the first one shallower than the
// current row. Pre-order + this stack is exactly how every indented-text
// tree (this one included, before the rebuild) already implied nesting; this
// just materializes it as real parent/children instead of a marginLeft.
function buildTreeNodes(rows){
  const root=[], stack=[];   // stack entries: {node, depth}
  rows.forEach(row=>{
    const node={row, children:[]};
    while(stack.length && stack[stack.length-1].depth>=row.depth) stack.pop();
    (stack.length ? stack[stack.length-1].node.children : root).push(node);
    stack.push({node, depth:row.depth});
  });
  return root;
}
// Build real nested DOM (folder = header .item + sibling .tchildren holding
// its recursively-built children; leaf = a lone .item) into `container`.
// Default state is fully expanded -- .collapsed is only ever ADDED by a
// click, never present at build time, so every change is visible on open.
function buildTreeDOM(nodes, container){
  nodes.forEach(n=>{
    const row=n.row, folder=isFolderRow(row);
    const {ci, gutter, text}=rowContent(row);
    const wrap=document.createElement('div');
    wrap.className='tnode'+(folder?' folder':' leaf');
    const header=document.createElement('div');
    // Row layout, left to right: [gutter: num+tag, fixed x] [indent spacer,
    // depth*13px] [chevron (folder) or same-width blank (leaf)] [glyph+text].
    // Only the last two shift with depth -- the gutter never moves (#42).
    const indent='<span class="tindent" style="width:'+(row.depth*13)+'px"></span>';
    const chev=folder ? '<span class="tchev">▾</span>' : '<span class="tchev leaf"></span>';
    header.innerHTML=gutter+indent+chev+text;
    if(ci!=null){
      header.dataset.i=ci; header.dataset.k=CHANGES[ci].kind; header.dataset.d=CHANGES[ci].change;
    }
    if(folder){
      // Folder rows always toggle (chevron OR anywhere on the row). A
      // folder that IS ITSELF a change (ci!=null -- e.g. an added/removed
      // case) ALSO jumps, in addition to toggling (#31 req: changed folders
      // stay navigable, not just their leaves).
      header.className='item';
      header.onclick=()=>{ wrap.classList.toggle('collapsed'); if(ci!=null) jump(ci); };
    }else{
      // A leaf jumps iff it correlates to a real CHANGES entry (ci!=null).
      // node/wire/constant/terminal changes all carry a uid now, so their rows
      // resolve to a CHANGES index and ARE clickable + badge-numbered; a pure
      // CONTEXT row (an unchanged scope with no ElementChange of its own)
      // resolves to null and renders as a non-clickable header.
      header.className='item'+(ci==null?' header':'');
      if(ci!=null) header.onclick=()=>jump(ci);
    }
    wrap.appendChild(header);
    if(folder){
      const kids=document.createElement('div');
      kids.className='tchildren';
      buildTreeDOM(n.children, kids);
      wrap.appendChild(kids);
    }
    container.appendChild(wrap);
  });
}
function renderTreeList(){
  list.innerHTML='';
  buildTreeDOM(buildTreeNodes(NETLIST_TREE), list);
}
// Auto-expand every ANCESTOR folder of change `i`'s tree row so a selection
// made via jump() (prev/next, deep-link, a flat-row click, …) is always
// visible in Tree mode, never hidden inside a collapsed folder. Walks up
// real DOM ancestry (.tchildren -> its owning .tnode -> repeat) rather than
// re-deriving frame_path, so it's correct regardless of how deep the row is.
function revealTreeRow(i){
  if(listMode!=='tree' || i<0) return;
  const row=list.querySelector('.item[data-i="'+i+'"]');
  if(!row) return;
  let el=row.parentElement && row.parentElement.parentElement;  // row's own .tnode -> its container
  while(el){
    const tnode=el.closest('.tnode');
    if(!tnode) break;
    tnode.classList.remove('collapsed');
    el=tnode.parentElement;
  }
}

let sel=-1, mode='split';
const PADPANE=16;
function svgOf(c){ return paneFor(c).querySelector('svg'); }

// ── Global zoom — one scale drives BOTH panes, in every view mode ──────────
let zoom=1;                          // 1 = whole VI fit to stage WIDTH (the readable default)
const ZMAX=8;                        // ZMIN is dynamic — see zMin()/fitBothZoom()
// before/after share ONE LV coordinate space but each svg carries its own tight
// viewBox — union registration (here + the margins applyZoom sets) is what maps
// the SAME LV point to the SAME screen point in both panes, in every mode.
function vbUnion(){
  const b=beforePane.querySelector('svg').viewBox.baseVal;
  const a=afterPane.querySelector('svg').viewBox.baseVal;
  return {minX:Math.min(b.x,a.x), minY:Math.min(b.y,a.y),
          w:Math.max(b.x+b.width, a.x+a.width)-Math.min(b.x,a.x),
          h:Math.max(b.y+b.height, a.y+a.height)-Math.min(b.y,a.y)};
}
function fitScale(){                  // css px per user px at zoom=1
  // Every mode fits to full width; Split mode stacks the panes vertically so each pane
  // gets the whole width (far better for wide LabVIEW diagrams).
  return (stage.clientWidth-2*PADPANE)/vbUnion().w;
}
// The zoom (relative to the width-fit baseline of 1) at which the WHOLE VI —
// both width AND height — fits the current scroll viewport with no scrollbars.
// Clamped to 1: a wide-short VI already fits its height at width-fit, so Fit
// never zooms IN past the readable width-fit. Only a TALL VI drives it below 1.
// Uses the live scroll viewport (stage, or a pane in split/overlay) so it's
// correct in every mode. This is the floor for zoom-out and the Fit target.
function fitBothZoom(){
  const u=vbUnion(), vp=scrollTargets()[0];
  const heightCssPerUser=(vp.clientHeight-2*PADPANE)/u.h;
  return Math.max(0.02, Math.min(1, heightCssPerUser/fitScale()));
}
function zMin(){ return fitBothZoom(); }   // no zooming out past "whole VI in view"
// ── Split view synced pan (mode 'split') ────────────────────────────────────────
// In every other mode `stage` itself is the one scroll container. In 'split'
// mode each pane is its OWN independent scroll viewport (see .stage.split .pane
// CSS), so zoom/focus/wheel must act on BOTH in lockstep. before/after share one
// coordinate space and one (global) zoom scale, so mirroring raw scrollLeft/
// scrollTop between them — or applying the identical px delta to both — keeps
// them locked to the same LV-coordinate region without any unit conversion.
function scrollTargets(){ return (mode==='split'||mode==='overlay') ? [beforePane, afterPane] : [stage]; }
function applyZoom(){
  const S=fitScale()*zoom;           // shared css-per-user scale → panes stay comparable
  const u=vbUnion();
  // EVERY mode registers the two svgs by the shared UNION box: each svg is
  // offset by its viewBox origin relative to the union min, so identical LV
  // coords land at identical screen points. Overlay superimposes the layers;
  // split sits the panes in their own scrollers but shares that SAME LV
  // coordinate registration, so the same LV column lands at the same screen x in
  // both panes — the pane whose origin sits right of the union min is indented
  // by the origin delta (e.g. JKI__build: before x=284 vs after x=144 indents
  // before ~140px), leaving a gap exactly where the after-VI added content to
  // the left. Tied-pan then mirrors 1:1 (see mirrorScroll) — no per-mode fixups.
  [beforePane,afterPane].forEach(p=>{const s=p.querySelector('svg'); if(!s)return;
    s.style.width=(s.viewBox.baseVal.width*S)+'px';
    s.style.marginLeft=((s.viewBox.baseVal.x-u.minX)*S)+'px';
    s.style.marginTop =((s.viewBox.baseVal.y-u.minY)*S)+'px';
    s.querySelectorAll('.hl-num').forEach(t=>t.style.fontSize=(15/S)+'px');});
  // At the limits the button would be a no-op (zoom clamps to [zMin(),ZMAX]) —
  // read as disabled. applyZoom runs on every zoom change, including glides.
  document.getElementById('zoomOut').disabled = zoom<=zMin()+1e-6;
  document.getElementById('zoomIn').disabled = zoom>=ZMAX;
  updateMinimap();   // keep the nav overlay in step with the shared zoom/scroll
}
// ── Smooth focus glide ──────────────────────────────────────────────────────
// `focus()` animates zoom+pan from the current view to its computed target with
// an eased glide instead of snapping. Any new selection or manual gesture must
// abandon an in-flight glide and retarget from wherever it currently is, so we
// keep a single module-level rAF handle and cancel it on every entry point.
let glideRAF=null;
function cancelGlide(){ if(glideRAF!==null){ cancelAnimationFrame(glideRAF); glideRAF=null; } }
// Reduced-motion users (and any non-animating context) get the instant path.
const ANIMATE = !matchMedia('(prefers-reduced-motion: reduce)').matches;
const easeInOutCubic = t => t<0.5 ? 4*t*t*t : 1-Math.pow(-2*t+2,3)/2;
function setZoom(z, ax, ay){          // keep viewport point (ax,ay) fixed while zooming
  cancelGlide();                      // a manual zoom retargets away from any glide
  z=Math.max(zMin(), Math.min(z, ZMAX));
  const targets=scrollTargets();
  if(ax===undefined){ax=targets[0].clientWidth/2; ay=targets[0].clientHeight/2;}
  const ratio=z/zoom;
  // Snapshot each linked target's own scroll position BEFORE the rescale, then
  // reapply the same (ax,ay)-anchored math to each — this is what keeps every
  // synced viewport pointed at the same region through a zoom change.
  const prev=targets.map(el=>({el, cx: el.scrollLeft+ax, cy: el.scrollTop+ay}));
  zoom=z; applyZoom();
  prev.forEach(({el,cx,cy})=>{ el.scrollLeft=cx*ratio-ax; el.scrollTop=cy*ratio-ay; });
}

// The on-screen element to centre `focus()` on for change `i`. jump() always
// calls revealFrame(c) BEFORE focus(i) (see below), so by the time this runs,
// c's own frame is already the shown one in its pane — a node/wire/structure
// change's real badge is therefore always visible here, no fallback needed.
// A frame/value change has no badge at all: target the live selector widget.
function visibleEl(i){
  const c=CHANGES[i];
  if(c.kind==='frame'||c.kind==='value') return selectorEl(paneFor(c), c.container_uid);
  return rects[i];
}
// The geometry to zoom/centre on for change `i` — the selector widget's own
// bounds for a frame/value change (it has no bounds of its own), else the
// change's real bounds.
function homeBox(i){
  const c=CHANGES[i];
  if(c.kind==='frame'||c.kind==='value') return selectorBounds(paneFor(c), c.container_uid);
  return c.bounds;
}

// Zoom the selected change's pane so the change occupies a comfortable share of
// the view, then centre it. The whole VI is otherwise fit-to-width, so a small
// node is a speck — this is what makes "next change" actually reveal it. Badge
// text is counter-scaled and the ring stroke is non-scaling, so both stay crisp.
function focus(i){
  cancelGlide();                       // abandon any in-flight glide; retarget from here
  const c=CHANGES[i], r=visibleEl(i); if(!r)return;
  const box=homeBox(i); if(!box)return;
  // `home` is the viewport that actually contains `r` (the change's own pane in
  // 'split' mode; `stage` everywhere else — it hosts both panes there).
  const home = mode==='split' ? paneFor(c) : stage;
  const targets=scrollTargets();
  // PADPANE accounts for `.stage`'s own padding — only relevant when `home` IS
  // the stage; a `.pane` acting as its own scroll container (side mode) has none.
  const homePad = home===stage ? 2*PADPANE : 0;
  const stageW=home.clientWidth-homePad, stageH=home.clientHeight-homePad;
  const [x1,y1,x2,y2]=box, pad=c.kind==='structure'?3:5;
  // Zoom to a NEIGHBOURHOOD, not the bare node: fit a context window (≥340 user
  // px, or the change itself if bigger) into ~85% of the smaller viewport axis —
  // a tiny node shows enlarged WITH surroundings. Uses the SAME global zoom, so
  // manual +/- and per-change focus share one scale.
  const ctx=Math.max((x2-x1)+2*pad, (y2-y1)+2*pad, 340);
  const S=Math.min(stageW, stageH)*0.85/ctx;   // desired css px per user px
  const Z=Math.max(1, Math.min(S/fitScale(), 8));   // TARGET zoom level

  // Capture the START state (current zoom + each linked target's own scroll)
  // BEFORE we disturb anything. `hw`/`hh` are the constant viewport half-extents
  // used to convert scroll ↔ viewport-centre.
  const z0=zoom;
  const start=targets.map(el=>({el, sl:el.scrollLeft, st:el.scrollTop,
                                hw:el.clientWidth/2, hh:el.clientHeight/2}));

  // Compute the EXACT target scroll the old snap produced: apply the target zoom,
  // then read the change's on-screen rect and offset each target by the centering
  // delta. Reading getBoundingClientRect() forces the reflow, so this is the same
  // measurement the old requestAnimationFrame took — the end state is unchanged.
  const targetScroll=()=>{
    zoom=Z; applyZoom();
    const rb=r.getBoundingClientRect(), hb=home.getBoundingClientRect();
    const dx=(rb.left+rb.width/2)-(hb.left+hb.width/2);
    const dy=(rb.top +rb.height/2)-(hb.top +hb.height/2);
    return start.map(s=>({sl:s.el.scrollLeft+dx, st:s.el.scrollTop+dy}));
  };

  // Reduced-motion / non-animating context: instant snap (byte-identical to the
  // old behaviour — set target zoom + scroll directly, deferred one frame).
  if(!ANIMATE){
    const tgt=targetScroll();
    requestAnimationFrame(()=>{
      start.forEach((s,idx)=>{ s.el.scrollLeft=tgt[idx].sl; s.el.scrollTop=tgt[idx].st; });
    });
    return;
  }

  // Animated glide. Measure the target (leaves zoom=Z), then build per-target
  // interpolation anchors in USER coordinates so the viewport CENTRE glides
  // smoothly across the two different zoom scales (a raw px-lerp of scroll would
  // drift, since zoom rescales the scroll space). fitScale() is zoom-independent
  // (viewBox + stage width only), so one capture is valid for the whole glide.
  const tgt=targetScroll();
  const fs=fitScale();
  const anim=start.map((s,idx)=>{
    const t=tgt[idx];
    return {el:s.el, hw:s.hw, hh:s.hh, slT:t.sl, stT:t.st,
      ucx0:(s.sl+s.hw)/(fs*z0), ucy0:(s.st+s.hh)/(fs*z0),   // start centre (user px)
      ucx1:(t.sl+s.hw)/(fs*Z),  ucy1:(t.st+s.hh)/(fs*Z)};   // target centre (user px)
  });
  // Rewind to the captured start so the first frame glides from where we were.
  zoom=z0; applyZoom();
  start.forEach(s=>{ s.el.scrollLeft=s.sl; s.el.scrollTop=s.st; });

  const t0=Date.now(), DUR=250;
  const step=()=>{
    const raw=Math.min(1, (Date.now()-t0)/DUR), e=easeInOutCubic(raw);
    if(raw>=1){                        // final frame: SET the exact target, no drift
      zoom=Z; applyZoom();
      anim.forEach(a=>{ a.el.scrollLeft=a.slT; a.el.scrollTop=a.stT; });
      glideRAF=null; return;
    }
    const zi=z0+(Z-z0)*e; zoom=zi; applyZoom();
    const sc=fs*zi;                    // current css-per-user scale
    anim.forEach(a=>{
      const ucx=a.ucx0+(a.ucx1-a.ucx0)*e, ucy=a.ucy0+(a.ucy1-a.ucy0)*e;
      a.el.scrollLeft=ucx*sc-a.hw; a.el.scrollTop=ucy*sc-a.hh;
    });
    glideRAF=requestAnimationFrame(step);
  };
  glideRAF=requestAnimationFrame(step);
}

// A property/health change (kind "property"/"health") has NO diagram
// element -- it's a VI-level setting, not a node/wire/structure. Its uid is
// a SYNTHETIC token (diff.py's ``"property:{label}"``/``"health:{label}"``
// -- see graph/diff.py's ``_mk_metadata_change``), not a real LabVIEW UID, so
// it never matches anything in the rendered SVG (no bounds, no data-node) --
// that's what makes this "element-less" rather than an explicit null check.
// Its "reveal" opens the popover (if closed) AND highlights + scrolls to the
// SPECIFIC matching row: the change's synthetic uid is "property:<rawField>",
// and <rawField> is the popover row's data-key (e.g. "lock_state"), so they
// match directly. (`c.kind==='structure'` in jump() is a SEPARATE, real
// diagram Case/Sequence-structure-node kind -- unrelated to this VI-level
// facet -- handled there for its own pre-existing reasons.)
function revealPropertyRow(c){
  const btn=document.getElementById('lvkitDiffPropsBtn');
  const panel=document.getElementById('lvkitDiffPropsPanel');
  if(!panel)return;
  // Remember that the SELECTION opened the popover, so deselecting the change
  // closes it again (clearSel); a manually-opened popover stays put.
  if(panel.hidden){ panel.hidden=false; window.lvkitPropPanelBySel=true; if(btn) btn.setAttribute('aria-expanded','true'); }
  const key=(c.uid||'').split(':').slice(1).join(':');
  if(!key)return;
  const cells=panel.querySelectorAll('[data-key="'+key+'"]');
  cells.forEach(el=>el.classList.add('lvkit-prop-selected'));
  if(cells[0]) cells[0].scrollIntoView({block:'nearest'});
  annotatePopoverBadges();
}
// Stamp each property change's list number onto its popover row (the <dt>),
// so "change N" in the change list is visible on the exact property it
// touched. Idempotent; run once deferred (after the popover is built) and
// again on reveal -- the rows persist, so badges stay for both a
// selection-opened and a manually-opened popover.
function annotatePopoverBadges(){
  const panel=document.getElementById('lvkitDiffPropsPanel');
  if(!panel) return;
  CHANGES.forEach((c,i)=>{
    if(c.kind!=='property') return;
    const key=(c.uid||'').split(':').slice(1).join(':');
    const dt=panel.querySelector('dt[data-key="'+key+'"]');
    if(!dt || dt.querySelector('.lvkit-prop-num')) return;
    const b=document.createElement('span');
    b.className='lvkit-prop-num'; b.textContent=(i+1);
    dt.insertBefore(b, dt.firstChild);
  });
}
setTimeout(annotatePopoverBadges, 0);
function jump(i){
  if(i<0||i>=CHANGES.length)return;
  if(i===sel){ clearSel(); return; }   // re-selecting the current change toggles it OFF
  sel=i;
  const c=CHANGES[i];
  // Property/health changes have no diagram presence at all -- reveal via
  // the properties popover instead of the diagram spotlight/zoom machinery
  // below (mode switching, frame reveal, focus() would all be no-ops for
  // them anyway, since they carry no bounds/frame_path, and their uid never
  // matches a diagram element). A signature change is the SAME "no diagram
  // element" shape but isn't part of the properties popover at all, so it
  // deliberately falls through to the normal path below -- every step there
  // (mode switch, focus()) already no-ops safely on a bounds-less/uid-less
  // change (see e.g. a top-level constant with no bounds), leaving just the
  // list-selection/highlight it needs.
  const propPanelEl=document.getElementById('lvkitDiffPropsPanel');
  if(propPanelEl) propPanelEl.querySelectorAll('.lvkit-prop-selected')
    .forEach(el=>el.classList.remove('lvkit-prop-selected'));
  if(c.kind==='property'||c.kind==='structure'){
    document.querySelectorAll('.item').forEach(n=>n.classList.toggle('sel',+n.dataset.i===i));
    revealTreeRow(i);
    revealPropertyRow(c);
    return;
  }
  // Respect the user's chosen view. Overlay + Split show BOTH versions,
  // so never yank out of them. Only correct a single-pane mode that's on the
  // wrong side for this change (added lives in after, removed in before) — otherwise
  // the change's element wouldn't exist in the shown pane at all.
  if(mode==='after' && c.change==='removed') setMode('before');
  else if(mode==='before' && c.change!=='removed') setMode('after');
  // Spotlight everything on the selected change: mark the row, box + badge, and
  // fade the rest (see .stage.has-sel CSS). Re-append the selected box+badge so
  // they draw on TOP of any neighbouring highlights.
  stage.classList.add('has-sel');
  document.querySelectorAll('.item').forEach(n=>n.classList.toggle('sel',+n.dataset.i===i));
  revealTreeRow(i);                              // auto-expand ancestor folders (Tree mode)
  Object.values(rects).forEach(r=>r.classList.remove('sel'));
  Object.values(nums).forEach(t=>t.classList.remove('sel'));
  Object.values(ghosts).forEach(g=>{if(!g)return;g.r.classList.remove('sel');if(g.t)g.t.classList.remove('sel');});
  Object.values(parts).flat().forEach(el=>el.classList.remove('sel'));
  const r=rects[i], t=nums[i], layer=layers[i];
  // chain wires first (drawn UNDER the node box, so the box caps them at its border)
  (parts[i]||[]).forEach(el=>{el.classList.add('sel'); if(layer)layer.appendChild(el);});
  if(r&&layer){r.classList.add('sel');layer.appendChild(r);}
  if(t&&layer){t.classList.add('sel');layer.appendChild(t);}
  const g=ghosts[i];                             // mirror box / old routing in before pane
  if(g){g.r.classList.add('sel');g.layer.appendChild(g.r);
        if(g.t){g.t.classList.add('sel');g.layer.appendChild(g.t);}}
  revealFrame(c);                                // switch case(s) to the change's frame
  revealBlend(c);                                // fade the change's own layer dominant
  focus(i);                                      // zoom + centre
}
// Clear any selection (row/box/badge .sel classes + the spotlight) WITHOUT
// touching zoom, scroll, or the shown frame. Shared by fit() and by
// toggle-deselect (re-clicking the already-selected change).
function clearSel(){
  sel=-1; stage.classList.remove('has-sel');
  document.querySelectorAll('.item.sel').forEach(n=>n.classList.remove('sel'));
  const propPanelEl=document.getElementById('lvkitDiffPropsPanel');
  if(propPanelEl) propPanelEl.querySelectorAll('.lvkit-prop-selected')
    .forEach(el=>el.classList.remove('lvkit-prop-selected'));
  // If a property SELECTION opened the popover, deselecting closes it again
  // (a manually-opened popover is left alone -- window.lvkitPropPanelBySel).
  if(window.lvkitPropPanelBySel && propPanelEl && !propPanelEl.hidden){
    propPanelEl.hidden=true;
    const pbtn=document.getElementById('lvkitDiffPropsBtn');
    if(pbtn) pbtn.setAttribute('aria-expanded','false');
  }
  window.lvkitPropPanelBySel=false;
  Object.values(rects).forEach(r=>r.classList.remove('sel'));
  Object.values(nums).forEach(t=>t.classList.remove('sel'));
  Object.values(parts).flat().forEach(el=>el.classList.remove('sel'));
  Object.values(ghosts).forEach(g=>{if(!g)return;g.r.classList.remove('sel');if(g.t)g.t.classList.remove('sel');});
}
function fit(){ clearSel(); setZoom(1); }  // Fit = width-fit; zoom-out still reaches fit-both via zMin()
document.getElementById('next').onclick=()=>jump(Math.min(CHANGES.length-1,sel+1));
document.getElementById('prev').onclick=()=>jump(Math.max(0,sel-1));
document.getElementById('zoomIn').onclick=()=>setZoom(zoom*1.3);
document.getElementById('zoomOut').onclick=()=>setZoom(zoom/1.3);
document.getElementById('zoomFit').onclick=fit;
// Ctrl/⌘ + wheel zooms about the cursor (native pinch-zoom feel). Anchor on
// whichever linked viewport the cursor is actually over (matters in 'split'
// mode, where before/after are two separate scroll containers of equal size).
stage.addEventListener('wheel',e=>{ if(!(e.ctrlKey||e.metaKey))return; e.preventDefault();
  const targets=scrollTargets();
  const hovered=targets.find(el=>el.contains(e.target))||targets[0];
  const hb=hovered.getBoundingClientRect();
  setZoom(zoom*(e.deltaY<0?1.15:1/1.15), e.clientX-hb.left, e.clientY-hb.top); },{passive:false});
// Any MANUAL pan gesture (plain wheel scroll, scrollbar/trackpad drag, touch)
// abandons an in-flight glide so the user's gesture wins immediately. These are
// input events only — programmatic scrollLeft/scrollTop writes during the glide
// fire 'scroll', not these, so the glide never cancels itself.
['wheel','pointerdown','touchstart'].forEach(ev=>

addEventListener('keydown',e=>{

  if(e.key==='+'||e.key==='=')setZoom(zoom*1.3); if(e.key==='-')setZoom(zoom/1.3);});

function setMode(m){
  if(m==='side')m='split';
  mode=m;
  const keep=(stage.classList.contains('has-sel')?' has-sel':'')
            +(stage.classList.contains('hide-hl')?' hide-hl':'');
  stage.className='stage '+(m==='split'?'split':m)+' mode-'+m+keep;
  document.querySelectorAll('button[data-mode]').forEach(b=>b.classList.toggle('active',b.dataset.mode===m));
  document.getElementById('opWrap').hidden=(m!=='overlay');  // #opWrap[hidden] hides it
  applyBlend();  // opacity/pointer-events only matter in overlay — see applyBlend()

  try{ buildMinimap(); updateMinimap(); }catch(_){}  // layers differ per mode
}
document.querySelectorAll('button[data-mode]').forEach(b=>b.onclick=()=>setMode(b.dataset.mode));
const op=document.getElementById('op');
// TRUE cross-fade, overlay mode only: before and after opacities are complements
// of each other (1-v / v), so the slider actually fades BEFORE out as it fades
// AFTER in — not a translucent after floating over an always-solid before. Clicks
// must land on whichever side is currently dominant, so pointer-events follows
// the same split (the CSS no longer hard-codes before as click-through). Split
// mode shows both panes at full opacity, each independently clickable.
function applyBlend(){
  const v=op.value/100;
  // The BEFORE/AFTER labels fade WITH their diagram (they live outside the pane in
  // overlay, so they don't inherit its opacity — set them explicitly).
  const bl=beforeWrap.querySelector('.pane-label'), al=afterWrap.querySelector('.pane-label');
  if(mode==='overlay'){
    beforePane.style.opacity=1-v; afterPane.style.opacity=v;
    if(bl)bl.style.opacity=1-v; if(al)al.style.opacity=v;
    const afterTop=+op.value>=50;
    afterPane.style.pointerEvents=afterTop?'auto':'none';
    beforePane.style.pointerEvents=afterTop?'none':'auto';
  }else{
    beforePane.style.opacity=1; afterPane.style.opacity=1;
    if(bl)bl.style.opacity=''; if(al)al.style.opacity='';
    beforePane.style.pointerEvents='auto'; afterPane.style.pointerEvents='auto';
  }
  try{ applyMinimapBlend(); }catch(_){}  // mirror the fade into the overlay minimap
}
op.oninput=()=>{cancelBlendGlide();applyBlend();};   // manual fader wins instantly
document.querySelectorAll('#opWrap .op-end').forEach(b=>b.addEventListener('click',()=>{cancelBlendGlide();op.value=b.dataset.op;applyBlend();}));

// ── Blend auto-reveal (Overlay only) ────────────────────────────────────────
// A removed change only EXISTS in the before layer (added/modified in after);
// if the fader currently favours the other side, the selected change is nearly
// invisible. On jump(), glide the fader just far enough that the change's own
// layer dominates — 25 for before-side, 75 for after-side — and only when the
// current value doesn't already show it (a user-chosen 10 stays 10 for a
// removed change). Eased with the same easeInOutCubic as the pan/zoom glide —
// no linear snapping sweeps — and reduced-motion users get an instant set.

function cancelBlendGlide(){ if(blendRAF!==null){ cancelAnimationFrame(blendRAF); blendRAF=null; } }
function revealBlend(c){

  if(target===v0)return;

    const raw=Math.min(1,(Date.now()-t0)/DUR), e=easeInOutCubic(raw);

applyBlend();   // initial state (op.value defaults to 70 — mostly-AFTER Overlay)
applyZoom();    // deterministic initial layout: shared-scale widths + union
                // registration from the first paint (never CSS-default 100%),
                // so mode switches can't change what "aligned" means.
// Highlight toggle: an icon button (◉ on / ○ off), .active styled like the
// mode buttons. Hiding is visibility-based (see .hide-hl CSS) so prev/next
// navigation keeps working with highlights off.
const hlBtn=document.getElementById('hlToggle');
hlBtn.onclick=()=>{
  const off=stage.classList.toggle('hide-hl');
  hlBtn.classList.toggle('active',!off);
  hlBtn.setAttribute('aria-pressed',String(!off));

// Tied-stacked synced-pan: dragging/scrolling (wheel, trackpad, scrollbar,
// touch) either pane's own viewport mirrors the SAME scroll offset onto the
// other. Active in BOTH 'split' and 'overlay' — the two modes whose
// scrollTargets are [beforePane, afterPane] (in overlay the panes are stacked,
// so an unmirrored native scroll on the active pane would slide the two layers
// out of registration). Custom drag-pan already writes both panes via
// scrollTargets; this covers NATIVE scroll (plain wheel, scrollbar, trackpad,
// keyboard) which bypasses that path. Re-entrancy-guarded so mirroring one
// doesn't ping-pong; the programmatic write below fires 'scroll' too but is
// idempotent (dst is already at src's offset from the pan that triggered it).
let syncingScroll=false;
function mirrorScroll(src, dst){
  src.addEventListener('scroll', ()=>{
    if((mode!=='split'&&mode!=='overlay')||syncingScroll)return;
    // Hold the guard across the INDUCED scroll event, not just this synchronous
    // write. dst's svg can be a different size than src's, so writing src's
    // offset onto dst gets browser-CLAMPED to dst's own scroll range; dst then
    // fires its own 'scroll' a tick later. Resetting the flag synchronously
    // (the old bug) let that clamped value mirror straight back and yank src to
    // dst's max — the "after snaps me left over and over" fight when panning the
    // wider pane past the narrower one's extent. rAF keeps the guard up until
    // after the induced event has fired and been ignored.
    syncingScroll=true;
    // Both overlay and split register the two svgs by the shared UNION box (see
    // applyZoom), so identical LV coords sit at identical scroll offsets in each
    // pane — mirror tied-pan 1:1, no per-mode origin-delta fixup.
    dst.scrollLeft=src.scrollLeft; dst.scrollTop=src.scrollTop;
    requestAnimationFrame(()=>{ syncingScroll=false; });
  });
}
mirrorScroll(beforePane, afterPane);
mirrorScroll(afterPane, beforePane);

// ── Per-pane case-frame model (#14/#15) ─────────────────────────────────
// The renderer bakes EVERY frame into the SVG as <g class="lv-frame"
// data-path="...;UID=VALUE">, hiding non-default ones, plus clickable selector
// chrome (<g class="lv-selector" data-lv-action data-lv-struct data-lv-frames>).
// Each pane keeps its OWN frame selection. A structure is REACHED via that pane's
// own ancestor chain (which can differ — e.g. after wraps a shared case inside a
// NEW case that before lacks), while a structure's OWN frame is CORRELATED by UID
// across panes so the comparison stays aligned. That split is what lets navigating
// to a change deep inside an after-only wrapper still reveal the UID-matched inner
// case in before.
function paneState(pane){
  const st={toggleable:new Set(), frames:{}, sel:{}};
  pane.querySelectorAll('.lv-selector[data-lv-action="toggle"]').forEach(g=>{
    const u=g.dataset.lvStruct;
    st.toggleable.add(u);
    st.frames[u]=(g.dataset.lvFrames||'').split(';').filter(Boolean);
    if(!(u in st.sel)) st.sel[u]=g.dataset.lvDefault;
  });
  return st;
}
const PST={before:paneState(beforePane), after:paneState(afterPane)};
function stFor(pane){ return pane===beforePane ? PST.before : PST.after; }

// A frame group shows iff every TOGGLEABLE struct on its path is on THAT pane's
// selected value. Non-toggleable segments (flat-sequence frames, shown together)
// are ignored so those keep rendering side by side.
function pathShown(st, path){
  return (path||'').split(';').every(seg=>{const [u,v]=seg.split('=');
    return !st.toggleable.has(u) || st.sel[u]===v;});
}
function applyPane(pane){
  const st=stFor(pane);
  pane.querySelectorAll('.lv-frame').forEach(g=>{
    g.classList.toggle('lv-frame-hidden', !pathShown(st, g.dataset.path));});
  pane.querySelectorAll('.lv-selector[data-lv-action="toggle"]').forEach(g=>{
    const u=g.dataset.lvStruct, t=g.querySelector('text');
    if(t && st.sel[u]!==undefined) t.textContent=st.sel[u];});
}
function applyFrames(){ applyPane(beforePane); applyPane(afterPane); updateParkState(); }

// ── Hidden-frame badge visibility ───────────────────────────────────────────
// A change is "hidden" in its own pane iff its frame_path isn't fully selected
// there — i.e. the renderer has that element's ancestor <g class="lv-frame">
// display:none right now, so there's nothing on screen to badge. Re-run after
// every applyFrames() (frame nav, deep-link, initial load) to keep every
// badge/row in sync with the CURRENT frame selection.
function isHidden(c){
  if(!c.frame_path) return false;
  return !pathShown(stFor(paneFor(c)), c.frame_path);
}
function updateParkState(){
  CHANGES.forEach((c,i)=>{
    if(!c.frame_path) return;               // top-level change — never hidden
    const hidden=isHidden(c);
    // frame/value changes have no on-canvas badge at all (see CHANGES.forEach
    // above) — only the selector's aggregate dot represents them, and that dot
    // is always visible regardless of which frame is currently shown.
    if(c.kind!=='frame' && c.kind!=='value'){
      // A change whose frame isn't currently shown stays VISIBLE but GHOSTED
      // (.offframe), rather than display:none — so in the unselected state every
      // change reads at a glance and the ones living in other frames are clearly
      // "elsewhere". The highlight overlay lives in a top-level hl-layer, so it
      // can draw at the node's real coordinates even though the node's own frame
      // group is hidden. The MODIFIED-change mirror box+badge in the other pane
      // (ghosts[i]) is gated the same way (frames are UID-correlated).
      if(rects[i]) rects[i].classList.toggle('offframe', hidden);
      if(nums[i]) nums[i].classList.toggle('offframe', hidden);
      // The node's incident "chain" wires (parts[i]) only make sense when the
      // node is on screen — gate them too, so navigating away from the frame
      // hides them even while the node stays selected.
      (parts[i]||[]).forEach(el=>el.classList.toggle('offframe', hidden));
      const g=ghosts[i];
      if(g){ if(g.r) g.r.classList.toggle('offframe', hidden);
             if(g.t) g.t.classList.toggle('offframe', hidden); }
    }
    // Looked up by data-i, not positional index — Tree mode's row order
    // doesn't match CHANGES order the way Flat's does (#31).
    const row=list.querySelector('.item[data-i="'+i+'"]');
    if(row) row.classList.toggle('dimmed', hidden);
  });
}

// Renamed-frame pairings: a case whose selector VALUE changed ("1" in before is
// the SAME frame as "0" in after) reports a kind:"value" change carrying both
// sides' addressing. Without this, correlating a frame across panes by copying
// the value picks a value the other pane doesn't have -> an empty frame. Keyed
// by struct uid -> {before:[...afterForThatBefore], after:{...}} lookups.
const framePairB2A={}, framePairA2B={};   // struct -> {beforeVal: afterVal} / reverse
CHANGES.forEach(c=>{
  if(c.kind!=='value' || !c.container_uid || !c.frame_path || !c.frame_path_before) return;
  const leaf=p=>{const s=p.split(';').pop(); return s.slice(s.indexOf('=')+1);};
  const b=leaf(c.frame_path_before), a=leaf(c.frame_path), u=String(c.container_uid);

  (framePairA2B[u]=framePairA2B[u]||{})[a]=b;

// The value a given pane should show so it lands on the SAME frame the user

// same-value frame — the common case), use it verbatim; otherwise translate
// through the renamed-frame pairing so "1" in before maps to "0" in after.
function frameValFor(u, v, isBefore){
  const st=isBefore?PST.before:PST.after;
  if(st.frames[u] && st.frames[u].indexOf(v)>=0) return v;   // pane has it directly
  const fwd=isBefore?framePairA2B[u]:framePairB2A[u];        // other pane's val -> this pane's val

// Set a structure's OWN frame — CORRELATED across panes so the same frame shows
// in before and after (comparison stays aligned), translating a renamed frame's
// value to each pane's own token.
function setFrame(u, v){
  if(PST.before.toggleable.has(u)) PST.before.sel[u]=frameValFor(u, v, true);
  if(PST.after.toggleable.has(u))  PST.after.sel[u]=frameValFor(u, v, false);

  const st=stFor(pane), fr=el&&el.closest('.lv-frame'); if(!fr)return;
  (fr.dataset.path||'').split(';').forEach(seg=>{const i=seg.indexOf('=');
    const u=seg.slice(0,i), v=seg.slice(i+1);
    if(u && st.toggleable.has(u)) st.sel[u]=v;});

// Reveal a change: put its OWN pane on frame_path's exact selection, then
// correlate the UID-shared ancestor structures into the OTHER pane via THAT
// pane's own ancestor chain — so a change under an after-only wrapper still
// surfaces the matched inner case in before for comparison.
//
// ROOT CAUSE (list-row click stopped centring): this used to reach the
// change's OWN pane state indirectly — `pane.querySelector(q)` for a node/
// struct, then `el.closest('.lv-frame').dataset.path` — and `if(!el)return`
// bailed out BEFORE calling applyFrames() whenever that query didn't match
// (wrong `data-node`/`data-lv-struct` shape, or the element simply not found).
// A skipped applyFrames() left the frame selection stale, so focus() (called
// right after revealFrame() in jump()) would try to centre on a badge that
// was still display:none — or, for a frame/value change, on a selector that
// hadn't moved to the right value yet. Every change already carries the exact
// answer in `c.frame_path` (root->leaf, INCLUDING its own frame — see
// diff.py's _frame_locality) for every kind, node/wire/structure included —
// so driving the OWN pane straight from that string (same technique the old
// frame/value-only branch already used) needs no DOM query at all and can
// never early-return before applyFrames() runs.
function revealFrame(c){
  const pane=paneFor(c), other=pane===afterPane?beforePane:afterPane;
  const st=stFor(pane), ost=stFor(other);
