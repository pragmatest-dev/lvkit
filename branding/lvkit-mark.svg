  <rect x="49" y="10" width="10" height="10" rx="1.5" fill="#e8821e"/>
  <rect x="49" y="44" width="10" height="10" rx="1.5" fill="#e8821e"/>
  <circle cx="32" cy="32" r="4.7" fill="#e8821e"/>
