<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 176 54" width="176" height="54" role="img" aria-label="LVkit">
  <!-- lvkit wordmark, LIGHT background: dark-grey "LV" + orange "kit". Mark is
       cap-height and vertically centred. Use lvkit-wordmark.svg (white LV) on dark. -->
  <g transform="translate(2,4) scale(0.72)">
    <path d="M15 32 H32 M32 32 V15 H45 M32 32 V49 H45" fill="none" stroke="#e8821e"
      stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="5" y="27" width="10" height="10" rx="1.5" fill="#e8821e"/>
    <rect x="45" y="10" width="10" height="10" rx="1.5" fill="#e8821e"/>
    <rect x="45" y="44" width="10" height="10" rx="1.5" fill="#e8821e"/>
    <circle cx="32" cy="32" r="4.7" fill="#e8821e"/>
  </g>
  <text x="47" y="41" font-family="'Segoe UI',system-ui,-apple-system,Roboto,'Helvetica Neue',Arial,sans-serif"
    font-weight="800" font-size="40" letter-spacing="-1.6">
    <tspan fill="#3f3b36">LV</tspan><tspan fill="#e8821e">kit</tspan>
  </text>
</svg>
