    <rect x="5" y="27" width="10" height="10" rx="1.5" fill="#e8821e"/>
    <rect x="45" y="10" width="10" height="10" rx="1.5" fill="#e8821e"/>
    <rect x="45" y="44" width="10" height="10" rx="1.5" fill="#e8821e"/>
    <circle cx="32" cy="32" r="4.7" fill="#e8821e"/>
  </g>
  <text x="47" y="41" font-family="'Segoe UI',system-ui,-apple-system,Roboto,'Helvetica Neue',Arial,sans-serif"
    font-weight="800" font-size="40" letter-spacing="-1.6">
